PLG_KUNENA_REPORTS = "Kunena - Reports in a category"
PLG_KUNENA_REPORTS_DESCRIPTION = "A report of a post (Report This) gets a topic in a category which the moderators use. A second report of the same post is a reply in that topic."
PLG_KUNENA_REPORTS_CATEGORY = "Category for the reports"
PLG_KUNENA_REPORTS_CATEGORY_DESC = "The topics of the reports are created in this category. Use a category which only the moderators can read. Without a category the plugin does nothing."
PLG_KUNENA_REPORTS_HOLD = "Hold a reported post for review after (reports)"
PLG_KUNENA_REPORTS_HOLD_DESC = "A post which is reported by this number of different users is hidden (unapproved) until a moderator approves it. 0 never holds a post. Posts of moderators and administrators are never held, and neither is the first post of a topic."
PLG_KUNENA_REPORTS_NO_CATEGORY = "No category (the plugin does nothing)"
