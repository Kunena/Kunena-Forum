<style>
  /* Colours and type. Dark is the default; a light set follows the system setting. */
  :root {
    color-scheme: dark;
    --bg: #0e1117;
    --panel: #151a23;
    --col: #131821;
    --card: #1b212c;
    --card-hover: #222938;
    --code: #10141b;
    --line: #262d3a;
    --line-strong: #3a4455;
    --text: #eef1f6;
    --muted: #aab2c2;
    --faint: #7f899b;
    --active: #56b6f7;
    --pass: #3fcf8e;
    --changes: #f5b544;
    --human: #ff6b6b;
    --merged: #b197fc;
    --brand: #ff2e74;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 24px -18px rgba(0, 0, 0, .7);
    --logo-filter: brightness(1.55);
    --sans: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: ui-monospace, "Cascadia Code", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f3f5f9;
      --panel: #ffffff;
      --col: #e9edf3;
      --card: #ffffff;
      --card-hover: #f7f9fc;
      --code: #f1f3f7;
      --line: #dce1e9;
      --line-strong: #bfc8d5;
      --text: #151a24;
      --muted: #4d586b;
      --faint: #6f7b8f;
      --active: #0b68c4;
      --pass: #0f7a55;
      --changes: #9a5600;
      --human: #c42b2b;
      --merged: #6238d1;
      --brand: #e0185c;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 10px 24px -18px rgba(16, 24, 40, .3);
      --logo-filter: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; }
  a { color: var(--active); }

  /* Header: stays in view while the page scrolls. */
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 12px 24px;
    flex-wrap: wrap; padding: 12px 28px;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; line-height: 0; }
  /* The logo is grey on transparent, made for a light page: lifted a little on the dark one. */
  h1 .logo { height: 38px; width: auto; display: block; filter: var(--logo-filter); }
  .head-right { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
  .repo {
    font-size: 13px; color: var(--muted); min-width: 0; max-width: min(760px, 62vw);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .repo b { color: var(--text); font-weight: 650; }
  .repo a { font-family: var(--mono); font-size: 12.5px; color: var(--active); text-decoration: none; }
  .repo a:hover { text-decoration: underline; }
  .repo .subject { color: var(--faint); }
  .status {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    font-size: 12.5px; color: var(--muted);
    padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); flex: none; }
  .status.error { color: var(--human); border-color: color-mix(in srgb, var(--human) 50%, var(--line)); }
  .status.error .dot { background: var(--human); }
  .banner {
    margin: 14px 28px 0; padding: 11px 15px; border-radius: 10px; font-size: 13.5px;
    color: var(--human); border: 1px solid color-mix(in srgb, var(--human) 45%, var(--line));
    background: color-mix(in srgb, var(--human) 9%, var(--panel));
  }

  /* Page: an overview, top to bottom. Numbers first, then what waits for you, then what
     runs, then what is finished. */
  .page { max-width: 1480px; margin: 0 auto; padding: 22px 28px 28px; display: grid; gap: 28px; }
  .page > section { min-width: 0; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; flex-wrap: wrap; }
  .sec-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .sec-head .count {
    font-size: 12.5px; font-weight: 650; padding: 1px 9px; border-radius: 999px; color: var(--muted);
    background: color-mix(in srgb, var(--muted) 16%, transparent);
  }
  .sec-head .sub { color: var(--faint); font-size: 13.5px; }
  .sec-head code, .none code { font-family: var(--mono); font-size: .92em; color: var(--muted); }
  .none {
    color: var(--faint); font-size: 14px; padding: 16px 18px;
    border: 1px dashed var(--line-strong); border-radius: 12px;
  }

  /* Numbers */
  .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tone, var(--line-strong));
    border-radius: 14px; padding: 14px 16px 13px; box-shadow: var(--shadow); min-width: 0;
  }
  .tile .k { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .v {
    font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2;
    font-variant-numeric: tabular-nums; color: var(--tone, var(--text));
  }
  .tile .s { font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.zero .v { color: var(--faint); }

  /* The pipeline, with who does each step and how many jobs are there now. */
  .pipe { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .pipe li {
    position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px 9px 14px; min-width: 0;
  }
  .pipe .name { font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 7px; }
  .pipe .who { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pipe .here {
    margin-left: auto; font-size: 12px; font-weight: 700; min-width: 20px; text-align: center;
    padding: 0 7px; border-radius: 999px; color: var(--active);
    background: color-mix(in srgb, var(--active) 16%, transparent);
  }
  .pipe li.busy { border-color: color-mix(in srgb, var(--active) 55%, var(--line)); }
  .pipe li.busy .name { color: var(--active); }

  /* Shared pieces of a job */
  .num { font-family: var(--mono); font-size: 12px; color: var(--faint); white-space: nowrap; }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--active); flex: none;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .flag {
    flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; white-space: nowrap; padding: 2px 9px; border-radius: 999px;
    color: var(--human); background: color-mix(in srgb, var(--human) 15%, transparent);
  }
  .flag.wait { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .flag.ok { color: var(--merged); background: color-mix(in srgb, var(--merged) 16%, transparent); }
  .flag.off { color: var(--muted); background: color-mix(in srgb, var(--muted) 16%, transparent); }
  .links { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; font-weight: 600; }
  .links a, .links span {
    padding: 2px 9px; border-radius: 6px; text-decoration: none; white-space: nowrap;
    color: var(--active); background: color-mix(in srgb, var(--active) 12%, transparent);
  }
  .links a:hover { background: color-mix(in srgb, var(--active) 22%, transparent); }
  .meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
    font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  [class^="risk-"] { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
  [class^="risk-"]::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .risk-high { color: var(--human); }
  .risk-medium { color: var(--changes); }
  .risk-low { color: var(--pass); }
  .rounds { display: grid; gap: 5px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .r { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 22px; flex: none; }
  .chip {
    flex: 1; text-align: center; font-size: 11.5px; font-weight: 600;
    padding: 3px 0; border-radius: 6px; border: 1px dashed var(--line-strong); color: var(--faint);
  }
  .chip.gate { flex: 0 0 44px; }
  .chip.wait { animation: breathe 1.6s ease-in-out infinite; border-color: var(--active); color: var(--active); }
  .chip.PASS { border: 1px solid transparent; color: var(--pass); background: color-mix(in srgb, var(--pass) 15%, transparent); }
  .chip.CHANGES { border: 1px solid transparent; color: var(--changes); background: color-mix(in srgb, var(--changes) 17%, transparent); }
  .chip.FAIL { border: 1px solid transparent; color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .chip.bad { border: 1px solid var(--human); color: var(--human); }
  .state { display: flex; align-items: center; gap: 7px; font-weight: 650; font-size: 13.5px; }
  .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .state.ok { color: var(--pass); }
  .state.stop { color: var(--human); }
  .todo-title { margin-top: 8px; color: var(--muted); }
  .todo { margin: 4px 0 0; padding-left: 1.25em; color: var(--text); }
  .todo li { margin: 2px 0; }
  .todo li.more { list-style: none; margin-left: -1.25em; color: var(--faint); }

  /* Waiting for you: one card per pull request, with what is asked of you. */
  .attention { display: grid; grid-template-columns: repeat(auto-fill, minmax(370px, 1fr)); gap: 14px; }
  .acard {
    display: flex; flex-direction: column; gap: 11px; min-width: 0; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--pass);
    border-radius: 14px; padding: 15px 18px 16px; box-shadow: var(--shadow);
    transition: border-color .15s, transform .15s;
  }
  .acard.stop { border-top-color: var(--human); }
  .acard:hover { transform: translateY(-1px); border-color: var(--line-strong); border-top-color: var(--pass); }
  .acard.stop:hover { border-top-color: var(--human); }
  .acard:focus-visible, .wrow:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  .a-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .a-top .num { min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .a-top .meta { margin-left: auto; flex: none; flex-wrap: nowrap; }
  .a-title { margin: 0; font-size: 16.5px; font-weight: 650; line-height: 1.35; overflow-wrap: anywhere; }
  .hint {
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--col);
    font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere;
  }
  .a-foot { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; margin-top: auto; }
  .a-foot .rounds { flex: 1; min-width: 210px; }

  /* Running: one row per job, with the step it is at. */
  .work { display: grid; gap: 10px; }
  .wrow {
    display: grid; grid-template-columns: minmax(240px, 1.1fr) minmax(340px, 1.7fr) auto;
    gap: 12px 26px; align-items: center; cursor: pointer; min-width: 0;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--active);
    border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow);
  }
  .wrow:hover { border-color: var(--line-strong); border-left-color: var(--active); }
  .wrow.waiting { border-left-color: var(--changes); }
  .wrow.waiting:hover { border-left-color: var(--changes); }
  .w-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; min-width: 0; }
  .w-top .num { overflow: hidden; text-overflow: ellipsis; }
  .wrow h3 { margin: 0 0 8px; font-size: 15.5px; font-weight: 650; line-height: 1.35; overflow-wrap: anywhere; }
  .w-steps { min-width: 0; display: grid; gap: 9px; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; }
  .steps li {
    flex: 1; min-width: 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--faint);
    padding-top: 8px; border-top: 3px solid var(--line-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .steps li.was { border-top-color: var(--pass); color: var(--muted); }
  .steps li.now { border-top-color: var(--active); color: var(--active); }
  .wrow.waiting .steps li.now { border-top-color: var(--changes); color: var(--changes); }

  /* Finished: a table. */
  .tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; box-shadow: var(--shadow); }
  table.jobs { width: 100%; border-collapse: collapse; font-size: 14px; }
  .jobs th {
    text-align: left; font-size: 12px; font-weight: 650; color: var(--faint); text-transform: uppercase;
    letter-spacing: .05em; padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .jobs td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .jobs tbody tr:last-child td { border-bottom: 0; }
  .jobs tbody tr { cursor: pointer; }
  .jobs tbody tr:hover { background: var(--card-hover); }
  .jobs tbody tr:focus-visible { outline: 2px solid var(--active); outline-offset: -2px; }
  .jobs .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  .jobs .t { font-weight: 600; }
  .jobs tr.rejected .t { color: var(--muted); font-weight: 500; }
  .jobs td.job { min-width: 280px; }
  .jobs td.job .num { margin-right: 10px; }
  .jobs .links { flex-wrap: nowrap; }

  @media (max-width: 1180px) {
    .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .pipe { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .wrow { grid-template-columns: 1fr; }
  }
  .acard.info { border-top-color: var(--changes); }
  .acard.info:hover { border-top-color: var(--changes); }
  .state.ask { color: var(--changes); }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .chip.wait { animation: none; }
    .acard, .drawer, .scrim { transition: none; }
  }

  /* Drawer */
  .scrim {
    position: fixed; inset: 0; z-index: 20; background: rgba(5, 8, 14, .6);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(980px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    display: grid; grid-template-rows: auto 1fr; transform: translateX(100%);
    transition: transform .25s ease;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; box-shadow: -24px 0 48px -24px rgba(0, 0, 0, .5); }
  .d-head { padding: 22px 28px 18px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head .num { font-size: 12.5px; }
  .d-head h3 { margin: 6px 48px 10px 0; font-size: 19px; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
  .close {
    position: absolute; top: 18px; right: 18px; width: 34px; height: 34px;
    border-radius: 9px; border: 1px solid var(--line); background: none; cursor: pointer;
    color: var(--muted); font-size: 20px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--line-strong); background: var(--card-hover); }
  .d-body { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 16px 10px; overflow-y: auto; }
  .files .group {
    font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em;
    color: var(--faint); margin: 14px 10px 5px;
  }
  .files .group:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer;
    font-family: var(--mono); font-size: 12.5px; color: var(--muted);
  }
  .file:hover { background: var(--card-hover); color: var(--text); }
  .file.on { background: color-mix(in srgb, var(--active) 14%, transparent); color: var(--text); }
  .file .rn { display: none; }
  .file .v { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); flex: none; }
  .v.good { background: var(--pass); } .v.warn { background: var(--changes); } .v.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 26px 32px 64px; min-width: 0; }

  /* Rendered markdown */
  .md { max-width: 720px; font-size: 15px; line-height: 1.7; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.7em 0 .5em; letter-spacing: -0.005em; }
  .md h1 { font-size: 22px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 1em; }
  .md ul, .md ol { padding-left: 1.4em; }
  .md li { margin: .25em 0; }
  .md li.task { list-style: none; margin-left: -1.4em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code {
    font-family: var(--mono); font-size: 13px; background: var(--code);
    border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px;
  }
  .md pre {
    background: var(--code); border: 1px solid var(--line); border-radius: 10px;
    padding: 13px 15px; overflow-x: auto; line-height: 1.55;
  }
  .md pre code { background: none; border: 0; padding: 0; }
  .md blockquote { border-left: 3px solid var(--line-strong); padding-left: 14px; color: var(--muted); }
  .md a { color: var(--active); }
  .md table { border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .md th { background: var(--code); font-weight: 650; }
  .verdict {
    display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .02em;
    padding: 4px 12px; border-radius: 999px; margin-bottom: 14px;
  }
  .verdict + * { margin-top: .4em; }
  .md .head { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin: -6px 0 16px; white-space: pre-line; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 15%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 17%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .note { color: var(--faint); font-size: 14px; }
  .md .summary {
    background: var(--code); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px 6px; margin: 0 0 24px;
  }
  .md .summary h2 {
    margin: 0 0 8px; font-size: 11.5px; font-weight: 650; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted);
  }
  .md .summary ul { margin: 0 0 .6em; }

  footer {
    padding: 0 28px 32px; font-size: 12.5px; color: var(--faint);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  footer span {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    padding: 3px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel);
  }

  @media (max-width: 760px) {
    header { padding: 12px 16px; }
    h1 .logo { height: 32px; }
    .head-right { justify-content: flex-start; }
    .repo { max-width: 100%; white-space: normal; }
    .repo .subject { display: none; }
    .banner { margin: 12px 16px 0; }
    .page { padding: 16px 16px 24px; gap: 24px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .tile .v { font-size: 27px; }
    .pipe { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .pipe li { padding: 8px 10px; }
    .pipe .who { display: none; }
    .attention { grid-template-columns: minmax(0, 1fr); }
    .a-top { flex-wrap: wrap; }
    .a-top .meta { margin-left: 0; flex: 1 0 100%; }
    .wrow { padding: 13px 14px; }
    .jobs .opt { display: none; }
    .jobs td.job { min-width: 0; }
    .jobs td.job .num { display: block; }
    .jobs th, .jobs td { padding: 10px 10px; }
    footer { padding: 0 16px 24px; }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files {
      border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px;
      overflow-x: auto; padding: 8px;
    }
    .files .group { display: none; }
    .file { width: auto; white-space: nowrap; }
    .file .rn { display: inline; white-space: pre; }
    .doc { padding: 18px 16px 48px; }
  }

<script>
const POLL_MS = 2000
// The steps of a job, in order, and who does each.
const STEPS = [
  { label: 'Intake', who: 'intake · {fable}', stage: 'intake' },
  { label: 'Spec', who: 'spec-writer · {opus}', stage: 'spec' },
  { label: 'Build', who: 'builder · {opus}', stage: 'build' },
  { label: 'Gate', who: 'checks.sh', stage: 'gate' },
  { label: 'Review', who: 'routed reviewers', stage: 'review' },
  { label: 'Approve', who: 'approver · {opus}', stage: 'approve' },
  { label: 'Merge', who: 'sync · gate · merge', stage: 'merging' },
]
const STAGES = new Set([...STEPS.map((s) => s.stage), 'needs-info', 'needs-human', 'merged', 'rejected'])
const LIVE = new Set(['intake', 'spec', 'build', 'gate', 'review', 'approve', 'merging'])
const SHORT = { code: 'code', ux: 'ux', ui: 'ui', security: 'sec' }

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

let jobs = []
let lastRender = ''
const roundCache = new Map() // "<job>/<n>" -> verdicts of a finished round
let openJobId = null
let openPath = null
let openText = null

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res.text()
}

// The versions of the models, from the price list in config.json: { fable: '5.2', opus: '5.5' }.
// A family which is listed with several versions shows the newest one.
const VERSIONS = {}

async function loadVersions() {
  try {
    const prices = JSON.parse(await fetchText('config.json')).prices_usd_per_mtok || {}
    for (const id of Object.keys(prices)) {
      const m = id.match(/^claude-([a-z]+)-(\d+)-(\d+)$/)
      if (!m) continue
      const [family, major, minor] = [m[1], Number(m[2]), Number(m[3])]
      const old = VERSIONS[family]
      if (!old || major > old.major || (major === old.major && minor > old.minor)) VERSIONS[family] = { major, minor }
    }
  } catch { /* without config.json the names stay as they are */ }
}

// The header: the version of Kunena, and the date and the subject of the last commit of the
// main checkout. factory/bin/job writes jobs/repo.json each time it runs.
async function loadRepo() {
  let repo
  try { repo = JSON.parse(await fetchText('jobs/repo.json')) } catch { return }
  const day = new Date(repo.date)
  const date = isNaN(day) ? '' : day.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
  const short = String(repo.commit || '').slice(0, 7)
  const commit = repo.url && short
    ? `<a href="${esc(repo.url)}/commit/${esc(repo.commit)}" target="_blank" rel="noopener">${esc(short)}</a>`
    : esc(short)
  $('repo').innerHTML = [
    repo.version ? `<b>Kunena ${esc(repo.version)}</b>` : '',
    esc(date),
    short ? `${commit} <span class="subject">${esc(repo.subject || '')}</span>` : '',
  ].filter(Boolean).join(' · ')
  $('repo').title = `Branch ${repo.branch || '?'}, last commit ${repo.date || '?'}`
}

// 'opus' → 'opus 5.5'; a name without a known version stays as it is.
function model(name) {
  const v = VERSIONS[name]
  return v ? `${name} ${v.major}.${v.minor}` : name
}

async function fetchFirst(url) {
  try { return (await fetchText(url)).split('\n')[0].trim() } catch { return null }
}

// ---- Overview ---------------------------------------------------------------

function verdictOf(line) {
  if (line === null) return 'pending'
  const m = line.match(/^(?:VERDICT|GATE):\s*(PASS|CHANGES|FAIL)$/)
  return m ? m[1] : 'invalid'
}

// A round's verdicts come from its files: the gate first, then each routed reviewer.
async function roundVerdicts(job, n) {
  const key = `${job.id}/${n}`
  if (roundCache.has(key)) return roundCache.get(key)
  const dir = `jobs/${job.id}/round-${n}/`
  const v = { gate: verdictOf(await fetchFirst(dir + 'checks.md')), reviews: {} }
  if (v.gate === 'PASS') {
    await Promise.all(Object.keys(job.agents?.reviewers || {}).map(async (r) => {
      v.reviews[r] = verdictOf(await fetchFirst(`${dir}review-${r}.md`))
    }))
  }
  const settled = v.gate === 'FAIL' || (v.gate === 'PASS' && Object.values(v.reviews).every((x) => x === 'PASS' || x === 'CHANGES'))
  if (settled && n < job.round) roundCache.set(key, v)
  return v
}

function chip(label, v, waiting, title, extra = '') {
  const cls = ['PASS', 'CHANGES', 'FAIL'].includes(v) ? v : v === 'pending' ? (waiting ? 'wait' : '') : 'bad'
  return `<span class="chip ${extra} ${cls}" title="${esc(title)}: ${esc(v)}">${esc(label)}</span>`
}

function roundRow(job, n, v) {
  const current = n === job.round
  const cells = [chip('gate', v.gate, current && job.stage === 'gate', 'gate', 'gate')]
  if (v.gate === 'PASS') {
    for (const r of Object.keys(job.agents.reviewers)) {
      cells.push(chip(SHORT[r] || r, v.reviews[r], current && job.stage === 'review', `${r} · ${model(job.agents.reviewers[r])}`))
    }
  }
  return `<div class="round"><span class="r">R${n}</span>${cells.join('')}</div>`
}

function elapsed(job) {
  const end = job.ended ? new Date(job.ended) : new Date()
  const min = Math.max(0, Math.floor((end - new Date(job.started)) / 60000))
  return min >= 60 ? `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}m` : `${min}m`
}

// The example jobs keep their issue and PR numbers but have no URLs.
const link = (url, text) =>
  url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : `<span>${text}</span>`

function links(job) {
  const out = [link(job.issue_url, `issue #${job.issue}`)]
  if (job.pr) out.push(link(job.pr_url, `PR #${job.pr}`))
  return out.join('')
}

// What a job in "Needs human" still needs: is the work itself done (the gate and every review
// passed, and the approver only wants a person to look), or is something left to fix? The
// points for the person come from the "For the human" section of decision.md.
async function humanState(job, last) {
  const read = async (name) => { try { return await fetchText(`jobs/${job.id}/${name}`) } catch { return '' } }
  const decision = await read('decision.md')
  const built = (await read('build.md')).split('\n')[0].trim()
  const reviews = last ? Object.values(last.reviews) : []
  const passed = !!last && last.gate === 'PASS' && reviews.length > 0 && reviews.every((v) => v === 'PASS')
  const section = decision.split(/^## For the human\s*$/m)[1] || ''
  const todo = section.split(/^## /m)[0].split('\n')
    .map((line) => line.match(/^(?:\d+\.|[-*])\s+(.*)$/))
    .filter(Boolean)
    .map((m) => {
      const bold = m[1].match(/^\*\*(.+?)\*\*/)
      const text = (bold ? bold[1] : m[1]).replace(/[`*]/g, '').replace(/[.:]\s*$/, '')
      return text.length > 110 ? `${text.slice(0, 107).trimEnd()}…` : text
    })
  if (decision.startsWith('ESCALATE') && passed) return { done: true, todo }
  const why = built === 'STATUS: BLOCKED' ? 'the builder is blocked'
    : last && last.gate === 'FAIL' ? 'the checks fail'
    : reviews.includes('CHANGES') ? 'a reviewer asked for changes'
    : decision.startsWith('APPROVE') ? 'the merge did not go through'
    : 'it stopped before the approval'
  return { done: false, why, todo }
}

function humanHint(job, state) {
  if (!state) return ''
  const pr = job.pr ? `PR #${job.pr}` : 'the job'
  const head = state.done
    ? `<div class="state ok">Built, checked and reviewed</div>`
    : `<div class="state stop">Not finished: ${esc(state.why)}</div>`
  const list = state.todo.length
    ? `<div class="todo-title">${state.done ? `Your part before merging ${esc(pr)}` : 'Asked of you'}</div>
       <ul class="todo">${state.todo.slice(0, 4).map((t) => `<li>${esc(t)}</li>`).join('')}${
         state.todo.length > 4 ? `<li class="more">and ${state.todo.length - 4} more: open the card</li>` : ''}</ul>`
    : `<div class="todo-title">${state.done ? `Waiting for you to merge ${esc(pr)}` : `Open the card to see what ${esc(pr)} needs`}</div>`
  return `<div class="hint">${head}${list}</div>`
}

// The questions which intake asked the author of the issue (the "Questions" section of intake.md).
async function infoState(job) {
  let intake = ''
  try { intake = await fetchText(`jobs/${job.id}/intake.md`) } catch { /* no file: no questions */ }
  const section = (intake.split(/^## Questions\s*$/m)[1] || '').split(/^## /m)[0]
  const todo = section.split('\n')
    .map((line) => line.match(/^(?:\d+\.|[-*])\s+(.*)$/))
    .filter(Boolean)
    .map((m) => {
      const text = m[1].replace(/[`*]/g, '')
      const first = text.match(/^.*?\?/)
      const short = first ? first[0] : text
      return short.length > 90 ? `${short.slice(0, 87).trimEnd()}…` : short
    })
  return { todo }
}

function infoHint(job, state) {
  const list = state.todo.length
    ? `<div class="todo-title">Asked on issue #${esc(job.issue)}</div>
       <ol class="todo">${state.todo.slice(0, 4).map((t) => `<li>${esc(t)}</li>`).join('')}${
         state.todo.length > 4 ? `<li class="more">and ${state.todo.length - 4} more: open the card</li>` : ''}</ol>`
    : `<div class="todo-title">Open the card to read the questions</div>`
  return `<div class="hint"><div class="state ask">Waiting for an answer on the issue</div>${list}</div>`
}

function jobName(job) {
  const [num, ...slug] = job.id.split('-')
  return { num, slug: slug.join('-') }
}

function metaOf(job) {
  const risk = job.intake?.risk
  return [
    risk ? `<span class="risk-${esc(risk)}">${esc(risk)}</span>` : '',
    `<span>$${Number(job.cost_usd).toFixed(2)}</span>`,
    `<span>${elapsed(job)}</span>`,
  ].join('')
}

// A job which waits: on you (a pull request to look at) or on the author of the issue.
function attentionCard(job, rounds, state) {
  const human = job.stage === 'needs-human'
  const { num, slug } = jobName(job)
  const cls = human ? (state.done ? '' : 'stop') : 'info'
  const flag = human ? '<span class="flag">your call</span>' : '<span class="flag wait">asked author</span>'
  return `
    <article class="acard ${cls}" data-job="${esc(job.id)}" tabindex="0">
      <div class="a-top">
        <span class="num">${esc(num)} · ${esc(slug)}</span>
        ${flag}
        <div class="meta">${metaOf(job)}</div>
      </div>
      <h3 class="a-title">${esc(job.title)}</h3>
      ${human ? humanHint(job, state) : infoHint(job, state)}
      <div class="a-foot">
        <div class="links">${links(job)}</div>
        ${rounds.length ? `<div class="rounds">${rounds.join('')}</div>` : ''}
      </div>
    </article>`
}

// A job which runs: its place in the pipeline and the verdicts of its rounds.
function workRow(job, rounds) {
  const { num, slug } = jobName(job)
  const at = STEPS.findIndex((s) => s.stage === job.stage)
  const steps = STEPS.map((s, i) =>
    `<li class="${i < at ? 'was' : i === at ? 'now' : ''}"${i === at ? ' aria-current="step"' : ''}>${esc(s.label)}</li>`).join('')
  return `
    <article class="wrow" data-job="${esc(job.id)}" tabindex="0">
      <div>
        <div class="w-top"><span class="pulse" aria-label="running"></span><span class="num">${esc(num)} · ${esc(slug)}</span></div>
        <h3>${esc(job.title)}</h3>
        <div class="links">${links(job)}</div>
      </div>
      <div class="w-steps">
        <ol class="steps">${steps}</ol>
        ${rounds.length ? `<div class="rounds">${rounds.join('')}</div>` : ''}
      </div>
      <div class="meta">${metaOf(job)}</div>
    </article>`
}

// A finished job: one row of the table.
function doneRow(job) {
  const { num } = jobName(job)
  const merged = job.stage === 'merged'
  const risk = job.intake?.risk
  const ended = job.ended ? new Date(job.ended) : null
  const day = ended && !isNaN(ended) ? ended.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''
  return `
    <tr class="${esc(job.stage)}" data-job="${esc(job.id)}" tabindex="0">
      <td class="job"><span class="num">${esc(num)}</span><span class="t">${esc(job.title)}</span></td>
      <td><span class="flag ${merged ? 'ok' : 'off'}">${merged ? 'merged' : 'rejected'}</span></td>
      <td><div class="links">${links(job)}</div></td>
      <td class="opt">${risk ? `<span class="risk-${esc(risk)}">${esc(risk)}</span>` : ''}</td>
      <td class="n opt">${job.round || '–'}</td>
      <td class="n">$${Number(job.cost_usd).toFixed(2)}</td>
      <td class="n opt">${elapsed(job)}</td>
      <td class="n opt">${esc(day)}</td>
    </tr>`
}

function tile(label, value, sub, tone) {
  const zero = value === 0 ? 'zero' : ''
  return `
    <div class="tile ${zero}"${tone ? ` style="--tone: var(--${tone})"` : ''}>
      <div class="k">${esc(label)}</div><div class="v">${esc(value)}</div><div class="s">${esc(sub)}</div>
    </div>`
}

const section = (title, count, sub, body) => `
  <section>
    <div class="sec-head"><h2>${esc(title)}</h2><span class="count">${count}</span><span class="sub">${sub}</span></div>
    ${body}
  </section>`

async function render() {
  const problems = []
  const attention = []
  const work = []
  const done = []
  for (const job of jobs) {
    if (!STAGES.has(job.stage)) { problems.push(`Job ${job.id} has unknown stage "${job.stage}"`); continue }
    if (job.stage === 'merged' || job.stage === 'rejected') { done.push(job); continue }
    const rounds = []
    let last = null
    for (let n = 1; n <= job.round; n++) {
      last = await roundVerdicts(job, n)
      rounds.push(roundRow(job, n, last))
    }
    if (job.stage === 'needs-human') attention.push([job, attentionCard(job, rounds, await humanState(job, last))])
    else if (job.stage === 'needs-info') attention.push([job, attentionCard(job, rounds, await infoState(job))])
    else work.push(workRow(job, rounds))
  }
  // Your pull requests first, then the questions to authors; the newest job first in each.
  attention.sort(([a], [b]) =>
    (a.stage === 'needs-human' ? 0 : 1) - (b.stage === 'needs-human' ? 0 : 1) || b.id.localeCompare(a.id))
  done.sort((a, b) => String(b.ended || '').localeCompare(String(a.ended || '')) || b.id.localeCompare(a.id))

  const count = (stage) => jobs.filter((j) => j.stage === stage).length
  const merged = count('merged')
  const cost = jobs.reduce((sum, j) => sum + Number(j.cost_usd), 0)
  const tiles = `
    <section class="tiles" aria-label="Numbers">
      ${tile('Running', work.length, work.length ? 'agents at work' : 'nothing runs now', 'active')}
      ${tile('Waiting for you', count('needs-human'), 'pull requests to look at', 'human')}
      ${tile('Asked the author', count('needs-info'), 'questions on the issue', 'changes')}
      ${tile('Merged', merged, `of ${jobs.length} jobs`, 'merged')}
      ${tile('Rejected', count('rejected'), 'not built', 'muted')}
      ${tile('Cost', `$${cost.toFixed(2)}`, merged ? `API-equivalent · $${(cost / merged).toFixed(2)} per merge` : 'API-equivalent')}
    </section>`

  const pipe = `<ol class="pipe">${STEPS.map((s) => {
    const here = count(s.stage)
    return `<li class="${here ? 'busy' : ''}">
      <div class="name">${esc(s.label)}${here ? `<span class="here">${here}</span>` : ''}</div>
      <div class="who">${esc(s.who.replace(/\{(\w+)\}/g, (_, name) => model(name)))}</div></li>`
  }).join('')}</ol>`

  const html = tiles
    + section('Waiting', attention.length, 'merge the pull request to approve it, or answer with <code>/factory &lt;feedback&gt;</code>',
      attention.length ? `<div class="attention">${attention.map(([, c]) => c).join('')}</div>`
        : '<div class="none">Nothing waits for you or for an author.</div>')
    + section('In progress', work.length, 'the pipeline, and the jobs which are in it now',
      `${pipe}<div class="work" style="margin-top: 10px">${work.reverse().join('')
        || '<div class="none">Nothing is running. Start with <code>/factory run</code>.</div>'}</div>`)
    + section('Finished', done.length, 'merged and rejected jobs, the newest first',
      done.length ? `<div class="tablewrap"><table class="jobs">
        <thead><tr><th>Job</th><th>Result</th><th>Links</th><th class="opt">Risk</th><th class="n opt">Rounds</th>
          <th class="n">Cost</th><th class="n opt">Time</th><th class="n opt">Ended</th></tr></thead>
        <tbody>${done.map(doneRow).join('')}</tbody></table></div>`
        : '<div class="none">No job is finished yet.</div>')
  const banner = problems.map((p) => `<div class="banner">${esc(p)}</div>`).join('')
  if (html + banner !== lastRender) {
    lastRender = html + banner
    $('board').innerHTML = html
    $('banner').innerHTML = banner
  }
}

async function poll() {
  const status = $('status')
  try {
    jobs = await loadJobs()
    await render()
    if (openJobId) await refreshDrawer()
    status.className = 'status'
    status.innerHTML = `<span class="dot"></span>jobs/ · ${new Date().toLocaleTimeString()}`
  } catch (err) {
    status.className = 'status error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}`
  }
}

// factory/bin/job writes each jobs/<id>/job.json.
async function loadJobs() {
  let listing
  try { listing = await fetchText('jobs/') } catch { return [] }
  const doc = new DOMParser().parseFromString(listing, 'text/html')
  const ids = [...doc.querySelectorAll('a')]
    .map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((h) => h.endsWith('/'))
    .map((h) => h.slice(0, -1))
    .sort()
  return Promise.all(ids.map(async (id) => JSON.parse(await fetchText(`jobs/${id}/job.json`))))
}

// ---- Drawer --------------------------------------------------------------

// python -m http.server serves an HTML index for directories; read its links.
async function listFiles(dir) {
  const doc = new DOMParser().parseFromString(await fetchText(dir), 'text/html')
  const hrefs = [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
  const out = []
  for (const h of hrefs) {
    if (h.endsWith('/')) out.push(...(await listFiles(dir + h)).map((f) => h + f))
    else if (h.endsWith('.md')) out.push(h)
  }
  return out
}

const ORDER = ['issue.md', 'intake.md', 'spec.md', 'build.md', 'decision.md', 'rejection.md']
const ROUND_ORDER = ['checks', 'review-code', 'review-security', 'review-ux', 'review-ui', 'merge-checks']

function fileRank(path) {
  if (ORDER.includes(path)) return [0, ORDER.indexOf(path), path]
  const round = path.match(/^round-(\d+)\/(.+)\.md$/)
  if (round) return [2, Number(round[1]) * 10 + ROUND_ORDER.indexOf(round[2]), path]
  return [1, 0, path] // intake-<k>.md, feedback-<k>.md
}

function sortFiles(files) {
  return files.sort((a, b) => {
    const [x, y] = [fileRank(a), fileRank(b)]
    return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2])
  })
}

function tone(first) {
  if (/^(VERDICT:\s*PASS|GATE:\s*PASS|APPROVE|STATUS:\s*READY|DECISION:\s*ACCEPT)$/.test(first)) return 'good'
  if (/^(VERDICT:\s*CHANGES|DECISION:\s*NEEDS-INFO)$/.test(first)) return 'warn'
  if (/^(ESCALATE|REJECTED|STATUS:\s*BLOCKED|GATE:\s*FAIL|DECISION:\s*REJECT)$/.test(first)) return 'stop'
  return null
}

const firstLines = new Map()

async function refreshDrawer() {
  const job = jobs.find((j) => j.id === openJobId)
  if (!job) return
  $('d-num').textContent = `${job.id} · ${job.stage}${job.round ? ` · round ${job.round}` : ''} · $${Number(job.cost_usd).toFixed(2)} · ${elapsed(job)}`
  $('d-title').textContent = job.title
  $('d-links').innerHTML = links(job)

  const base = `jobs/${job.id}/`
  const files = sortFiles(await listFiles(base))
  if (!openPath || !files.includes(openPath)) openPath = files[0] || null

  let text = null
  if (openPath) {
    text = await fetchText(base + openPath)
    firstLines.set(base + openPath, text.split('\n')[0].trim())
  }
  await Promise.all(files.filter((f) => !firstLines.has(base + f)).map(async (f) => {
    firstLines.set(base + f, (await fetchText(base + f)).split('\n')[0].trim())
  }))

  let group = null
  $('d-files').innerHTML = files.map((f) => {
    const g = f.includes('/') ? f.split('/')[0].replace('round-', 'Round ') : 'Job'
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ''
    group = g
    const round = f.match(/^round-(\d+)\//)
    const name = round
      ? `<span class="rn">R${round[1]} </span>${esc(f.split('/')[1].replace(/^review-|\.md$/g, ''))}`
      : esc(f)
    const t = tone(firstLines.get(base + f) || '')
    return `${head}<button class="file ${f === openPath ? 'on' : ''}" data-file="${esc(f)}">
      <span class="v ${t || ''}"></span>${name}</button>`
  }).join('') || '<div class="empty">No files yet.</div>'

  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = text === null ? '<p class="note">Intake hasn’t written anything yet.</p>' : markdown(text)
  }
}

async function openDrawer(id) {
  openJobId = id
  openPath = null
  openText = undefined
  document.body.classList.add('open')
  try {
    await refreshDrawer()
  } catch (err) {
    $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>`
  }
}

function closeDrawer() {
  openJobId = null
  document.body.classList.remove('open')
}

document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return
  const cardEl = e.target.closest('[data-job]')
  if (cardEl) return openDrawer(cardEl.dataset.job)
  const fileEl = e.target.closest('[data-file]')
  if (fileEl) {
    openPath = fileEl.dataset.file
    openText = undefined
    $('d-doc').parentElement.scrollTop = 0
    return refreshDrawer()
  }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeDrawer()
  const cardEl = e.target.closest?.('[data-job]')
  if (cardEl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(cardEl.dataset.job) }
})

// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

// Every step's file has a `## Summary` of a few bullets; show it first, in a box.
function splitSummary(lines) {
  const start = lines.findIndex((l) => /^##\s+Summary\s*$/.test(l))
  if (start === -1) return { lines, summary: null }
  let end = start + 1
  while (end < lines.length && !/^#{1,2}\s/.test(lines[end])) end++
  return {
    lines: [...lines.slice(0, start), ...lines.slice(end)],
    summary: lines.slice(start + 1, end).join('\n'),
  }
}

function markdown(src) {
  const split = splitSummary(src.replace(/\r/g, '').split('\n'))
  const lines = split.lines
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) {
    html += `<div class="verdict ${t}">${esc(first)}</div>`
    i = 1
    // The rest of a KEY: value header block (intake.md, checks.md).
    const extra = []
    while (i < lines.length && /^[A-Z-]+:\s/.test(lines[i])) extra.push(lines[i++])
    if (extra.length) html += `<div class="head">${esc(extra.join('\n'))}</div>`
  }
  if (split.summary !== null) html += `<section class="summary"><h2>Summary</h2>${markdown(split.summary)}</section>`

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${markdown(body.join('\n'))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

poll()
loadVersions()
loadRepo()
setInterval(loadRepo, 15000)
setInterval(poll, POLL_MS)
