name: Deploy Nightly
on:
  schedule:
    - cron: '0 2 * * *' # run at 2 AM UTC

jobs:
  nightly:
    name: Deploy nightly
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP (for Composer)
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.1'         # adjust to the PHP version your project requires
          tools: composer

      - name: Install Phing on runner
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer
          PHING_VERSION: '3.1.0'     # keep the version you used previously
        run: |
          mkdir -p "$COMPOSER_HOME"
          # Install phing configurator (optional) and phing itself into isolated COMPOSER_HOME
          composer -n global require --no-progress phing/phing-composer-configurator:dev-master || true
          composer -n global require --no-progress "phing/phing:${PHING_VERSION}"
          # Make composer global bin directory available to subsequent steps
          echo "PATH=${COMPOSER_HOME}/vendor/bin:${PATH}" >> $GITHUB_ENV

      - name: Verify phing
        run: phing -v

      # Add your Phing build/deploy step(s) below, e.g.:
      # - name: Run Phing build
      #   run: phing your-target
