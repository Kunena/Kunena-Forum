; Using new INI string format for Joomla! 2.5

PLG_KUNENA_ACL = "Kunena - ACL (Permission by Rank)"
PLG_KUNENA_ACL_DESCRIPTION = "Kunena plugin which limits a category to the users with a rank. Choose the access type <em>Rank</em> in the permissions of the category."
PLG_KUNENA_ACL_ACCESS = "Enable Permission by Rank"
PLG_KUNENA_ACL_ACCESS_DESC = "When disabled, the access type <em>Rank</em> is not available and the categories which use it are not shown."

COM_KUNENA_INTEGRATION_TYPE_KUNENA_RANK = "Rank"

PLG_KUNENA_ACL_ACCESS_TITLE = "Minimum Rank:"
PLG_KUNENA_ACL_ACCESS_DESC_FORM = "Users with this rank or a higher rank can see the category. A rank is reached with a number of posts. Guests never have access. Moderators and administrators always have access."
PLG_KUNENA_ACL_OPTION_REGISTERED = "Every registered user"
PLG_KUNENA_ACL_OPTION_SAME = "Same as the minimum rank"
PLG_KUNENA_ACL_OPTION_FROM_POSTS = "%s (from %d posts)"
PLG_KUNENA_ACL_X_OR_HIGHER = "%s or higher"
PLG_KUNENA_ACL_SPECIAL_TITLE = "Special Ranks With Access:"
PLG_KUNENA_ACL_SPECIAL_DESC = "Users who were given one of these special ranks have access, whatever their number of posts is."
PLG_KUNENA_ACL_POST_TITLE = "Minimum Rank to Create Topics:"
PLG_KUNENA_ACL_POST_DESC = "A higher rank can be needed to create topics. Users with a lower rank can read the category, but cannot create topics."
PLG_KUNENA_ACL_REPLY_TITLE = "Minimum Rank to Reply:"
PLG_KUNENA_ACL_REPLY_DESC = "A higher rank can be needed to reply. Users with a lower rank can read the category, but cannot reply."
