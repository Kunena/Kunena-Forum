;
; All translations can be found from https://crowdin.com/project/kunena-forum
; Note: All ini files need to be saved as UTF-8

PLG_KUNENA_INBOX = "Kunena - Inbox"
PLG_KUNENA_INBOX_DESCRIPTION = "An inbox for every user with the private messages and the notifications of the forum (subscriptions, followed users, mentions). The e-mail of a notification becomes optional."
PLG_KUNENA_INBOX_PRIVATE = "Private messages"
PLG_KUNENA_INBOX_PRIVATE_DESC = "Users can send private messages to each other (the message button of a post and of a profile)."
PLG_KUNENA_INBOX_NOTIFICATIONS = "Notifications"
PLG_KUNENA_INBOX_NOTIFICATIONS_DESC = "Subscriptions, followed users, moderation, mentions and thanks give an entry in the inbox of the user."
PLG_KUNENA_INBOX_EMAIL_DEFAULT = "E-mail as well, by default"
PLG_KUNENA_INBOX_EMAIL_DEFAULT_DESC = "Users get the e-mail of a notification as well as the entry in the inbox. Every user can change this in the inbox."
PLG_KUNENA_INBOX_ATTACHMENTS = "Attachments in private messages"
PLG_KUNENA_INBOX_ATTACHMENTS_DESC = "Users can send files with a private message. The allowed types and the largest size are the ones of the attachments of the forum (the file and image types). The files can only be downloaded by the sender and the recipient."
PLG_KUNENA_INBOX_ATTACHMENT_MAX = "Files for a message"
PLG_KUNENA_INBOX_ATTACHMENT_MAX_DESC = "The largest number of files of a private message."
PLG_KUNENA_INBOX_DELETE_READ_DAYS = "Delete read entries after (days)"
PLG_KUNENA_INBOX_DELETE_READ_DAYS_DESC = "Read notifications are deleted after this number of days, when new entries are added. 0 keeps them until the user deletes them."
