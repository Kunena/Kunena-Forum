PLG_KUNENA_GEOIP = "Kunena - Location of the IP address"
PLG_KUNENA_GEOIP_DESCRIPTION = "Shows the place (country, region, city) of the IP address of a message next to the address, for the people who see the address (administrators, and moderators when the IP addresses are not hidden). It needs the library GeoIP of Regular Labs with its database."
