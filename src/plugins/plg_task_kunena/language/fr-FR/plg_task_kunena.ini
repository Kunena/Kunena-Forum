; language file for kunena task plugin
PLG_TASK_KUNENA="Tâche - Kunena Forum"
PLG_TASK_KUNENA_DESCRIPTION="Plugin Tâche Kunena -- Veuillez ne pas le dépublier ou le désinstaller"

; Scheduler Title
PLG_TASK_KUNENA_REMOVEEXPIREDBANS_TITLE="Suppression des bannis expirés dans Kunena"
PLG_TASK_KUNENA_REMOVEEXPIREDBANS_DESC="Supprime tous les bans expirés pour les utilisateurs."
PLG_TASK_KUNENA_PURGETRASH_TITLE="Purger la corbeille de Kunena."
PLG_TASK_KUNENA_PURGETRASH_DESC="Purge tous les messages et sujets mis à la corbeille."
PLG_TASK_KUNENA_CLEANPENDINGATTACHMENTS_TITLE="Nettoyer les pièces jointes mises en attente de Kunena"
PLG_TASK_KUNENA_CLEANPENDINGATTACHMENTS_DESC="Supprime toutes les pièces jointes en attente (statut = 0) qui n'ont jamais été attachées à un message."
PLG_TASK_KUNENA_UNSUBSCRIBEINACTIVE_TITLE="Kunena - Se désabonner des utilisateurs inactifs des catégories"
PLG_TASK_KUNENA_UNSUBSCRIBEINACTIVE_DESC="Supprime les abonnements de catégorie des utilisateurs qui ne se sont pas connectés à Joomla pour la durée configurée. Les utilisateurs qui ne se sont jamais connectés sont ignorés."

; Configuration
PLG_TASK_KUNENA_AGE_LABEL="Âge en jours"
PLG_TASK_KUNENA_AGE_DESC="Purger les messages de la corbeille plus anciens que le nombre de jours configurés. Mettre à 0 pour supprimer tous les messages de la corbeille."
PLG_TASK_KUNENA_INACTIVITY_YEARS_LABEL="Durée de l'inactivité"
PLG_TASK_KUNENA_INACTIVITY_YEARS_DESC="Les utilisateurs dont la dernière visite est plus ancienne que cette durée seront désabonnés de toutes les catégories."
