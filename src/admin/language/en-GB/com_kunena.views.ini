COM_KUNENA_CONFIGURATION_USER_STATUS = "Show User Status"
COM_KUNENA_CONFIGURATION_USER_STATUS_DESC = "Show the user status on the profile"
COM_KUNENA_PLAINEMAIL = "Plain Text Emails"
COM_KUNENA_PLAINEMAIL_DESC = "Send plain text emails. Set <em>No</em> to send html emails."
COM_KUNENA_CONFIG_AVATAR_FILESALLOWED = "Allowed avatar types"
COM_KUNENA_CONFIG_AVATAR_FILESALLOWED_DESC = "Specify here which avatar types are allowed for upload. Use comma-separated, lowercase lists without spaces. Example: jpg,jpeg,png,gif. You may add svg: SVG files are cleaned on upload (scripts and remote references are removed)."
