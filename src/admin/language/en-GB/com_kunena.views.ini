COM_KUNENA_A_LOOKS = "Look and Feel"
COM_KUNENA_A_MAILADMIN = "E-mail Administrators"
COM_KUNENA_A_MAILADMIN_DESC = "Set to <em>Unapproved Posts</em> or <em>All New Posts</em> if you want e-mail notifications on new posts sent to the Kunena administrators."
COM_KUNENA_A_MESSAGES = "Messages Per Page"
COM_KUNENA_A_MESSAGES_DESC = "Number of messages per page to show"
COM_KUNENA_A_MESSAGES_DESC_SEARCH = "Messages per page for search results"
COM_KUNENA_A_MESSAGES_SEARCH = "Search Results"
COM_KUNENA_A_MAILMOD = "E-mail Moderators"
COM_KUNENA_A_MAILMOD_DESC = "Set to <em>Unapproved Posts</em> or <em>All New Posts</em> if you want e-mail notifications on new posts sent to the category moderators. Note: Global moderators and administrators do not get e-mail notifications with this option unless you explicitly assign them as moderators on the category."
COM_KUNENA_A_PESONNALTEXT = "Max. Personal Text Length"
COM_KUNENA_A_PESONNALTEXT_DESC = "Maximum number of characters allowed for the personal text in user profile."
COM_KUNENA_A_POLL_ALLOW_ONE_VOTE = "Single Vote Only"
COM_KUNENA_A_POLL_ALLOW_ONE_VOTE_DESC = "Limit an individual user to vote only once per poll."
COM_KUNENA_A_POLL_ENABLED = "Enable Polls"
COM_KUNENA_A_POLL_NUMBER_OPTIONS = "Maximum Number Poll Options"
COM_KUNENA_A_POLL_NUMBER_OPTIONS_DESC = "Set the number maximum allowed for the field options for the polls when the users create a new post."
COM_KUNENA_A_POLL_NUMBER_VOTES_BY_DESC = "Set the maximum number for the votes allowed for one user. If Single Vote option has been enabled, this setting is ignored."
COM_KUNENA_A_POLL_NUMBER_VOTES_BY_USER = "Maximum Number of Votes Per User"
COM_KUNENA_A_POLL_SHOW_USER_LIST = "Show Voters"
COM_KUNENA_A_POLL_SHOW_USER_LIST_DESC = "Display a list of all the voters for a particular poll, maintaining confidentiality on the votes themselves."
COM_KUNENA_A_POLL_TIME_VOTES = "Time Between Consecutive Votes"
COM_KUNENA_A_POLL_TIME_VOTES_DESC = "For avoid overload of your server, set a time between two votes of the same user, example 00:15:00 means 15 minutes between two votes"
COM_KUNENA_A_POLL_TITLE = "Poll Settings"
COM_KUNENA_A_PUBWRITE = "Allow Guests to Post/Write"
COM_KUNENA_A_PUBWRITE_DESC = "Set to <em>Yes</em> to allow Guests (non registered users e.a. public) write/post privileges. Set to <em>No</em> to force Guest access to be read-only. This option alone is not enough: in each category where guests should post, <em>User Groups Allowed To Post</em> and <em>User Groups Allowed To Reply</em> on the <em>Category Permissions</em> tab must also include the Public or Guest group. By default these settings only include Registered, Manager and Super Users."
COM_KUNENA_A_RANKING = "Ranking"
COM_KUNENA_A_RANKINGIMAGES = "Show Rank"
COM_KUNENA_A_RANKINGIMAGES_DESC = "Set to <em>Title</em> to show rank title only. Set to <em>Image</em> to show rank title and rank image. Set to <em>User Group</em> to show rank title and user group name. Set to <em>All above</em> to show rank title, rank image and user group name. Set to <em>Ranks by CSS</em> to show rank title and icons."
COM_KUNENA_A_RANKING_DESC = "Set to <em>Yes</em>, if you want to show the rank registered users have based on the number of posts they made.<br /><strong>Note: You must also enable <em>Show User Statistics</em> in the <em>Users</em> tab to show it.</strong>"
COM_KUNENA_A_RANKING_SETTINGS = "Ranking Settings"
COM_KUNENA_A_RECAPTCHA_PRIVATEKEY = "reCAPTCHA Private Key"
COM_KUNENA_A_RECAPTCHA_PRIVATEKEY_DESC = "<a target='_blank' href='https://www.google.com/recaptcha/admin/create'/>Please click here</a> to get reCAPTCHA private key and enter it into this field."
COM_KUNENA_A_RECAPTCHA_PUBLICKEY = "reCAPTCHA Public Key"
COM_KUNENA_A_RECAPTCHA_PUBLICKEY_DESC = "Please enter your reCAPTCHA public key into this field."
COM_KUNENA_A_RECAPTCHA_THEME = "reCAPTCHA Theme"
COM_KUNENA_A_RECAPTCHA_THEME_DESC = "Choose a reCAPTCHA theme."
COM_KUNENA_A_REGISTERED_ONLY = "Registered Users Only"
COM_KUNENA_A_REG_ONLY_DESC = "Set to <em>Yes</em> to limit all forum access to registered users (view and post). Set to <em>No</em> to allow any Guest (non registered visitor) to at least see the forum. See 'Allow Guests to post/write' for additional Guest access control."
COM_KUNENA_A_RSS = "Enable RSS Feeds"
COM_KUNENA_A_RSS_ALLOW_HTML = "Render HTML &amp; BBCode in RSS feeds"
COM_KUNENA_A_RSS_ALLOW_HTML_DESC = "Allowing HTML in RSS feeds can be seen as a security threat, as hackers sometimes try to smuggle evil javascripts and images into forum-messages.<br />However, Kunena has a good security in this matter, and it recommended to allow HTML in RSS feeds for maximum user experience."
COM_KUNENA_A_RSS_AUTHOR_FORMAT = "Author Format"
COM_KUNENA_A_RSS_AUTHOR_FORMAT_DESC = "Select to display either author name or author e-mail in RSS feeds."
COM_KUNENA_A_RSS_AUTHOR_IN_TITLE = "Render Author in Title"
COM_KUNENA_A_RSS_AUTHOR_IN_TITLE_DESC = "Select if author also should be visible in RSS item titles."
COM_KUNENA_A_RSS_CACHE = "Caching Interval"
COM_KUNENA_A_RSS_CACHE_DESC = "How many minutes between caching of RSS feed output. Select '0' to disable caching. <br />Please beware, lower numbers may affect performance!"
COM_KUNENA_A_RSS_DESC = "The RSS feed enables users to download the latest posts to their desktop or RSS reader application. See <a href='http://www.rssreader.com' target='_blank'>rssreader.com</a> for an example."
COM_KUNENA_A_RSS_EXCLUDED_CATEGORIES = "Exclude Categories"
COM_KUNENA_A_RSS_EXCLUDED_CATEGORIES_DESC = "Select the the categories to be excluded in <u>all</u> feeds."
COM_KUNENA_A_RSS_INCLUDED_CATEGORIES = "Include Categories"
COM_KUNENA_A_RSS_INCLUDED_CATEGORIES_DESC = "Select the categories to be included exclusively in global feeds. <br />Please note: This option is not real useful, because global feeds will then ONLY present data from these categories specified.<br />Note: categories will be ignored, if feed is on a category level."
COM_KUNENA_CONFIG_RSSINCLUDEDCATEGORIES_SHOW_ALL = "Show all categories"
COM_KUNENA_CONFIG_RSSEXCLUDEDCATEGORIES_NOT_EXCLUDE = "Not exclude the categories"
COM_KUNENA_A_RSS_LIMIT = "RSS Limit"
COM_KUNENA_A_RSS_LIMIT_DESC = "You can also limit the number of items in your RSS feeds. Use this, if the timelimit is not enough. Can be used with, or without, a timelimit.<br />Use 0 or leave empty for no limit."
COM_KUNENA_A_RSS_OLD_TITLES = "Use Oldstyle Titles"
COM_KUNENA_A_RSS_OLD_TITLES_DESC = "<u>No</u> - Titles will be kept intact, looking like this: \\'#post title#\\'<br /><u>Yes</u> - Titles will look like this: \\'Subject: #post title# - By: #author#\\'"
COM_KUNENA_A_RSS_SPEC = "RSS Specification"
COM_KUNENA_A_RSS_SPEC_DESC = "Specify an custom format for all RSS feeds."
COM_KUNENA_A_RSS_TIMELIMIT = "RSS History (timelimit)"
COM_KUNENA_A_RSS_TIMELIMIT_DESC = "Select how much history should be included in the global RSS feeds. The default is one month, but it is recommended to limit it to one week on high volume sites."
COM_KUNENA_A_RSS_TYPE = "RSS Feed type"
COM_KUNENA_A_RSS_TYPE_DESC = "Choose between RSS feed types.<br /><u>Post</u> - Show the latests posts from the forum.<br /><u>Topic</u> - Show the latest topics from the forum (topics only).<br /><u>Recent topics</u> - Show the latest post from recently updated topics."
COM_KUNENA_CONFIG_RSS_CHARACTERS_COUNT = "Limit Number of Characters Per Item"
COM_KUNENA_CONFIG_RSS_CHARACTERS_COUNT_DESC = "How many characters shall each post in feed contain?<br />Note: This feature may cut off BBCode. Most feed readers can handle this."
COM_KUNENA_A_RSS_FEEDBURNER_URL = "The URL of the basic RSS feed into FeedBurner."
COM_KUNENA_A_RSS_FEEDBURNER_URL_DESC = "If you use FeedBurner to serve your RSS, enter here the full URL of your RSS in FeedBurner. https://feedburner.google.com/ . Please note that you will need to setup the feed in feedburner to point to your feed in this site.<br />Leave empty if you dont use FeedBurner."
COM_KUNENA_A_SECURITY = "Security"
COM_KUNENA_A_SECURITY_SETTINGS = "Security Settings"
COM_KUNENA_A_SEND_EMAILS = "Send E-mails to Users"
COM_KUNENA_A_SEND_EMAILS_DESC = "Choose if you want to send e-mails to your users. This feature should be turned on unless you are testing your site."
COM_KUNENA_CONFIG_EMAIL_SENDER_NAME = "Sender name for mail"
COM_KUNENA_CONFIG_EMAIL_SENDER_NAME_DESC = "Sender name for mail send by Kunena, this needs an E-Mail address in the field Forum E-mail Address"
COM_KUNENA_A_SHOWBANNEDREASON_PROFILE = "Show Banned Reason"
COM_KUNENA_A_SHOWBANNEDREASON_PROFILE_DESC = "Display reason why the user has been banned in user profile"
COM_KUNENA_A_SHOWMAIL = "Show E-mail"
COM_KUNENA_A_SHOWMAIL_DESC = "Set to <em>No</em> if you never want to display the users e-mail address even to registered users."
COM_KUNENA_A_SHOWNEW = "Show New posts"
COM_KUNENA_A_SHOWNEW_DESC = "If set to <em>Yes</em>, Kunena displays an indicator about new posts since a user last visited the forum."
COM_KUNENA_A_SIGNATURE = "Max. Signature Length"
COM_KUNENA_A_SIGNATURE_DESC = "Maximum number of characters allowed for the user signature."
COM_KUNENA_A_SUBJECTLENGTH = "Max. Subject Length"
COM_KUNENA_A_SUBJECTLENGTH_DESC = "Maximum Subject line length. The maximum number supported by the database is 255 characters. If your site is configured to use multi-byte character sets like Unicode, UTF-8 or non-ISO-8599-x, make the maximum smaller using this formula:<br /><tt>round_down(255/(maximum character set byte size per character))</tt><br /> Example: for UTF-8, for which the max. character byte size per character is 4 bytes: 255/4=63."
COM_KUNENA_A_SUBSCRIPTIONS = "Allow Subscriptions"
COM_KUNENA_A_SUBSCRIPTIONS_DESC = "Registered users can subscribe to topics and/or categories and receive e-mail notifications when new posts are added."
COM_KUNENA_A_SUBSCRIPTIONS_EMAIL_BATCH_SIZE = "Email Batch Size"
COM_KUNENA_A_SUBSCRIPTIONS_EMAIL_BATCH_SIZE_DESC = "Maximum number of queued notification emails to send per run of the scheduled task. Increase this value for high-traffic forums; lower it if your mail server imposes rate limits."
COM_KUNENA_A_SUBSCRIPTIONS_EMAIL_VISIBLE_ADDRESS = "Visible E-mail Recipient"
COM_KUNENA_A_SUBSCRIPTIONS_EMAIL_VISIBLE_ADDRESS_DESC = "If a single subscription e-mail is sent to more than one recipient and <em>E-mail Recipient Privacy = Hide Other Recipients (BCC)</em>, you should have a valid e-mail address in this field.<br /><strong>Warning:</strong> This e-mail address will get all the e-mail sent by the forum. If no e-mail address is provided, subscription e-mails may be treated as spam."
COM_KUNENA_A_USE_SYSTEM_EMAILS = "Treat as System Email"
COM_KUNENA_A_USE_SYSTEM_EMAILS_DESC = "When enabled, emails will only be sent to users whose Joomla account is enabled to <em>Receive System Emails</em>"
COM_KUNENA_A_TAHEIGHT = "Textarea Height"
COM_KUNENA_A_TAHEIGHT_DESC = "Adjust the height of the reply/post text entry area to match your template"
COM_KUNENA_A_TAWIDTH = "Textarea Width"
COM_KUNENA_A_TAWIDTH_DESC = "Adjust the width of the reply/post text entry area to match your template. <br />The Topic Emoticon Toolbar will be wrapped across two lines if width <= 420 pixels"
COM_KUNENA_A_THANKYOU = "Enable Thank You Feature"
COM_KUNENA_A_THANKYOU_DESC = "Set to <em>Yes</em> to allow the users to 'Thank you' messages."
COM_KUNENA_A_THREADS = "Topics Per Page"
COM_KUNENA_A_THREADS_DESC = "Number of topics per page to show"
COM_KUNENA_A_TOPIC_SUBSCRIPTIONS = "Topic Subscriptions"
COM_KUNENA_A_TOPIC_SUBSCRIPTIONS_DESC = "This option requires <em>Allow Subscriptions = Yes</em>. If set to <em>E-mail First Update</em>, only one e-mail will be sent to subscribers saying that there are new posts in that topic; users will not receive updates to those topics unless they log in and read the topics individually. If set to <em>E-mail Every Update</em>, e-mails will be posted for all new postings made in topics that users are subscribed to."
COM_KUNENA_A_ENABLE_MARKDOWN = "Enable Markdown"
COM_KUNENA_A_ENABLE_MARKDOWN_DESC = "Messages can use Markdown next to BBCode: **bold**, *italic*, ~~strikethrough~~, # headings, lists, > quotes, `code`, ```code blocks```, [links](https://example.com), images and tables. Existing messages with characters like * or _ can look different when this is switched on."
COM_KUNENA_A_ENABLE_HTML = "Enable HTML"
COM_KUNENA_A_ENABLE_HTML_DESC = "Messages can use a safe set of HTML tags next to BBCode: b, strong, i, em, u, s, sup, sub, a (href), img (src), headings, lists, tables, blockquote, pre and code. All other tags and all attributes are shown as plain text or removed. Only web, mail and site addresses are allowed in links and images."
COM_KUNENA_A_TRIMLONGURLS = "Trim Long URLs"
COM_KUNENA_A_TRIMLONGURLSBACK = "Back Portion of Trimmed URLs"
COM_KUNENA_A_TRIMLONGURLSBACK_DESC = "Number of characters for back portion of trimmed URLs. Trim long URLs must be set to <em>Yes</em>."
COM_KUNENA_A_TRIMLONGURLSFRONT = "Front Portion of Trimmed URLs"
COM_KUNENA_A_TRIMLONGURLSFRONT_DESC = "Number of characters for front portion of trimmed URLs. Trim long URLs must be set to <em>Yes</em>."
COM_KUNENA_A_TRIMLONGURLS_DESC = "Set to <em>Yes</em> if you want long URLs to be trimmed. See URL trim front and back settings."
COM_KUNENA_A_UPLOADS = "Uploads"
COM_KUNENA_A_USERNAME_DESC = "Which name of a user is shown: the <em>username</em> (login name), the <em>real name</em> (the name of the Joomla user) or the <em>nickname</em> (a custom field of the Joomla users, chosen below). When the chosen name is empty the next one is shown (nickname, real name, username)."
COM_KUNENA_A_NAME_USERNAME = "Username"
COM_KUNENA_A_NAME_REALNAME = "Real name"
COM_KUNENA_A_NAME_DISPLAYNAME = "Nickname"
COM_KUNENA_A_DISPLAYNAME_FIELD = "Field with the nickname"
COM_KUNENA_A_DISPLAYNAME_FIELD_DESC = "The custom field of the Joomla users (Users - Fields) which holds the nickname. Make the field editable by the users in the profile."
COM_KUNENA_A_NAME_USER_CHOICE = "Users choose their name"
COM_KUNENA_A_NAME_USER_CHOICE_DESC = "Users can choose in their forum settings which of their names (username, real name or nickname) others see."
COM_KUNENA_A_USERS = "Users"
COM_KUNENA_A_USERSTATS = "Show User Statistics"
COM_KUNENA_A_USERSTATS_DESC = "Set to <em>Yes</em> to show User Statistics like number of user posts and user type (Admin, Moderator, User, etc.)."
COM_KUNENA_A_USER_EDIT = "User Edits"
COM_KUNENA_A_USER_EDIT_DESC = "Set to <em>Yes</em> to allow registered users to edit their own posts."
COM_KUNENA_A_USER_EDIT_TIME = "User Edit Time"
COM_KUNENA_A_USER_EDIT_TIMEGRACE = "User Edit Grace Time"
COM_KUNENA_A_USER_EDIT_TIMEGRACE_DESC = "Default 600 [seconds], allows storing a modification up to 600 seconds after edit link disappears."
COM_KUNENA_A_USER_EDIT_TIME_DESC = "Set to 0 for unlimited time, else window in seconds from post or last modification to allow edit."
COM_KUNENA_A_USER_KEYWORDS = "Enable User Keywords"
COM_KUNENA_A_USER_KEYWORDS_DESC = "Set <em>Yes</em> to enable keywords for users. This setting allows users to add their own keywords, which are not visible to other users."
COM_KUNENA_A_USER_MARKUP = "Show Edited Mark Up"
COM_KUNENA_A_USER_MARKUP_DESC = "Set to <em>Yes</em> if you want an edited post be marked up with text showing that the post was edited by a user and when."
COM_KUNENA_A_USER_RELATED = "User Related"
COM_KUNENA_CACHING_SETTINGS = "Caching Settings"
COM_KUNENA_CATIMAGEPATH_LEGACY = "Category Legacy Image Path"
COM_KUNENA_CATIMAGEPATH_LEGACY_DESC = "Category Legacy Image Path. This is the legacy image path used only for compatibility with old templates, this setting can be found now in template settings. If you set the path as <em>category_images</em>, the full path will be <em>your_html_rootfolder/media/kunena/category_images/</em>"
COM_KUNENA_CFG_ACCESS_COMPONENT_DESC = "Set <em>Yes</em> to allow direct access to <b>%s</b> URLs. It is adviced to turn off this setting, but only after proper testing. Disabling this feature improves SEO and brings some protection against spam bots. <b>Warning:</b> If you see <em>404 %s</em> errors after setting this option to <em>No</em>, please check that you have correctly set up the Kunena menu."
COM_KUNENA_CFG_CACHE = "Caching"
COM_KUNENA_CFG_CACHE_DESC = "Select whether to cache content in Kunena."
COM_KUNENA_CFG_CACHE_TIME = "Cache Time"
COM_KUNENA_CFG_CACHE_TIME_DESC = "Time before the output is recached. This option affects items like <em>Who Is Online</em> and <em>Statistics</em> changing the content only when the cache expires. To keep the data valid, it's recommended to use small values, like 1-3 minutes."
COM_KUNENA_CFG_DEFAULT_SORT = "Message Ordering"
COM_KUNENA_CFG_DEFAULT_SORT_DESC = "Select default message ordering when viewing a topic. This setting can be overridden by user."
COM_KUNENA_CFG_FALLBACK_ENGLISH = "Use English On Missing Strings"
COM_KUNENA_CFG_FALLBACK_ENGLISH_DESC = "Use English language if translation is missing. If set to <em>No</em> or debug mode has been turned on, translation keys (COM_KUNENA_LANGUAGE_KEY) are shown instead."
COM_KUNENA_CFG_POST_DATEFORMAT = "Message Time Format"
COM_KUNENA_CFG_POST_DATEFORMAT_DESC = "Choose time format for messages shown in the forum."
COM_KUNENA_CFG_POST_DATEFORMAT_HOVER = "Hover Message Time Format"
COM_KUNENA_CFG_POST_DATEFORMAT_HOVER_DESC = "Choose time format, which is shown when you hover on message time."
COM_KUNENA_COM_A_ARTICLE_DISPLAY = "Choose how to display article by default"
COM_KUNENA_COM_A_ARTICLE_DISPLAY_DESC = "Choose how to display Joomla! articles by default in messages"
COM_KUNENA_COM_A_BBCODE_IMG_SECURE = "Display Images With Non-standard File Extensions"
COM_KUNENA_COM_A_BBCODE_IMG_SECURE_DESC = "This option changes the way how [img] tag behaves on image extensions which are not allowed in Joomla Media Manager. Default option is <em>Text</em>, which prevents users from exploiting security vulnerabilities in badly designed Joomla extensions."
COM_KUNENA_COM_A_ENABLELIGHTBOX = "Enable Lightbox for Images"
COM_KUNENA_COM_A_ENABLELIGHTBOX_DESC = "Enable lightbox for images which are displayed in forum."
COM_KUNENA_COM_A_ENABLE_THREADED_LAYOUTS = "Allow Different Topic Layouts"
COM_KUNENA_COM_A_ENABLE_THREADED_LAYOUTS_DESC = "Allow users to change topic layout between flat, threaded and indented."
COM_KUNENA_COM_A_HIDE_IP = "Hide IP Addresses From Moderators"
COM_KUNENA_COM_A_HIDE_IP_DESC = "Hide IP in messages from moderators and show IP only for administrators"
COM_KUNENA_COM_A_MOD_SEE_DELETED = "Show Deleted Messages"
COM_KUNENA_COM_A_MOD_SEE_DELETED_DESC = "Do you want to allow moderators or administrators to be able to see and restore deleted messages in the frontend. By default only administrators can do this."
COM_KUNENA_COM_A_ORDERING_SYSTEM = "Reply Numbering Inside Topic"
COM_KUNENA_COM_A_REPORT = "Message Reporting"
COM_KUNENA_COM_A_REPORT_DESC = "If you want to allow users to report any message, select <em>Yes</em>."
COM_KUNENA_CATEGORY_LANGUAGE = "Language"
COM_KUNENA_CATEGORY_LANGUAGE_DESC = "On a multilingual site the category is only shown on the pages in this language. Choose All to show it in every language."
COM_KUNENA_CATEGORY_TRANSLATIONS = "Translations"
COM_KUNENA_CATEGORY_TRANSLATIONS_DESC = "The name and the descriptions of the category in the other languages of the site. Leave a language empty to show the texts of the basic tab."
COM_KUNENA_A_BADGES = "Badges"
COM_KUNENA_A_SOCIALS = "Social websites"
COM_KUNENA_A_SOCIALS_DESC = "The social websites which users can fill in on the Profile Information tab of their profile. A user fills in his username, which is put in the address of the website at ##VALUE##. The icon is a <a href='https://fontawesome.com/icons' target='_blank' rel='noopener noreferrer'>Font Awesome</a> class (like fa-brands fa-facebook). With <em>No link</em> the value is only shown and not linked. To be able to add, remove and move socials you need an extra plugin availaible on kunena.org. A website which is removed is hidden: the values of the users are kept. A website switched off with <em>Enabled</em> is hidden in the profile edit form and on the profile page: the values of the users are kept."
COM_KUNENA_A_SOCIAL_KEY = "Key"
COM_KUNENA_A_SOCIAL_TITLE = "Name"
COM_KUNENA_A_SOCIAL_URL = "Address of the profile"
COM_KUNENA_A_SOCIAL_ICON = "Icon"
COM_KUNENA_A_SOCIAL_NOURL = "No link"
COM_KUNENA_A_SOCIAL_ENABLED = "Enabled"
COM_KUNENA_A_SOCIAL_KEY_INVALID = "The key %s is not valid: use 1 to 30 lowercase letters, digits or underscores."
COM_KUNENA_A_SOCIAL_KEY_TWICE = "The key %s is used twice."
COM_KUNENA_A_SOCIAL_URL_INVALID = "The address of %s has to start with http://, https://, skype:, tg:, mailto: or tel: and has to contain ##VALUE## (the place of the username)."
COM_KUNENA_A_SOCIALS_SAVED = "Social websites saved."
COM_KUNENA_A_BADGES_SAVED = "Badges saved."
COM_KUNENA_A_BADGES_DESC = "A badge is a label with a colour which is shown next to the name of a user: in the posts of a topic and on the profile. A user gets a badge when he is a member of the Joomla user group of the badge or has the Kunena rank of the badge (fill in the group, the rank or both)."
COM_KUNENA_A_BADGE_TITLE = "Label"
COM_KUNENA_A_BADGE_COLOR = "Colour"
COM_KUNENA_A_BADGE_USERGROUP = "User group"
COM_KUNENA_A_BADGE_RANK = "Rank"
COM_KUNENA_A_BADGE_NONE = "- None -"
COM_KUNENA_A_MAIL_SETTINGS = "Mail"
COM_KUNENA_A_USE_MAIL_TEMPLATES = "Use the mail templates of Joomla"
COM_KUNENA_A_USE_MAIL_TEMPLATES_DESC = "Set to Yes to make the e-mails of the forum (replies and new topics for subscribers and moderators, mentions and reported messages) from the mail templates of Joomla: the subject and the text are edited in Users, Mail Templates, with the tags like {TOPIC} and {URL}. With No (or when a template is missing) the layouts of the template of the forum are used."
COM_KUNENA_A_POPUP_NOTIFICATIONS = "Popup notifications"
COM_KUNENA_A_POPUP_NOTIFICATIONS_DESC = "Show a popup with a link to the message when the user is mentioned, somebody replies in his topic or in a topic he follows, or somebody starts a topic in a category he follows. The popup comes while a forum page is open. The users can switch it off in their own forum settings."
COM_KUNENA_A_POPUP_NOTIFICATIONS_INTERVAL = "Popup check (seconds)"
COM_KUNENA_A_POPUP_NOTIFICATIONS_INTERVAL_DESC = "How often the browser asks for new popups, while the page is visible. A lower number is faster and puts more load on the server."
COM_KUNENA_A_QUICK_BAN = "Ban button on messages"
COM_KUNENA_A_QUICK_BAN_DESC = "Moderators get the entry Ban user in the Moderate menu of a message: a box where they choose the duration and write the reason, and the user is banned in one step. It is not shown for administrators, moderators, yourself and users who are banned already."
COM_KUNENA_A_QUICK_BAN_LEVEL = "Ban from"
COM_KUNENA_BAN_BANLEVEL_JOOMLA = "Site"
COM_KUNENA_BAN_BANLEVEL_KUNENA = "Forum"
COM_KUNENA_A_QUICK_BAN_LEVEL_DESC = "The start value of the box. Only administrators can choose to block the user from the whole site, for moderators the ban is always from the forum."
COM_KUNENA_A_QUICK_BAN_DAYS = "Duration (days)"
COM_KUNENA_A_QUICK_BAN_DAYS_DESC = "The start value of the duration in the box. 0 is permanent."
COM_KUNENA_A_QUICK_BAN_DELETE_POSTS = "Delete the posts too"
COM_KUNENA_A_QUICK_BAN_DELETE_POSTS_DESC = "The start value of the checkbox Delete all posts of this user in the box."
COM_KUNENA_A_REPORT_MAIL = "E-mail to moderators for reports"
COM_KUNENA_A_REPORT_MAIL_DESC = "A report of a post (Report This) is sent by e-mail to the moderators of the category. Switch it off when a plugin handles the reports (for example by a topic in a category for the moderators). A report is refused when it can not be handled by the e-mail (e-mails are off or the sender address is wrong) and no plugin handles it."
COM_KUNENA_A_MENTION_EMAIL = "E-mail to mentioned users"
COM_KUNENA_A_MENTION_EMAIL_DESC = "A user who is mentioned in a post (with @) gets an e-mail with a link to the post. Users can switch this e-mail off in their forum settings. A user who ignores the author, may not read the post or is blocked gets no e-mail, and an edit does not send the e-mail again for a user who was mentioned before."
COM_KUNENA_A_EMAIL_FORUM_HEADERS = "Extra e-mail headers"
COM_KUNENA_A_EMAIL_FORUM_HEADERS_DESC = "Adds headers which describe the message to the e-mails of Kunena (X-Forum, X-Forum-URL, X-Forum-Name, X-Forum-Category, X-Forum-Category-Id, X-Forum-Topic, X-Forum-Topic-Id, X-Forum-Post-Id, X-Forum-Type and X-Forum-Who), so mail programs can filter on them. The Message-ID of the first message of a topic is made from the topic and the e-mails of replies get In-Reply-To and References headers, so mail programs show the e-mails of a topic as one thread."
COM_KUNENA_A_ENABLE_TAGS = "Tag topics (Joomla Tags)"
COM_KUNENA_A_ENABLE_TAGS_DESC = "The author of a topic and the moderators can tag the topic with the tags of the Joomla component Tags (Components - Tags). The tags are shown on the topic and in the lists of topics, and the lists can be filtered on a tag. Users can only choose existing tags."
COM_KUNENA_A_REDIRECT_DELETED_TOPICS = "Redirect deleted topics with 410 Gone"
COM_KUNENA_A_REDIRECT_DELETED_TOPICS_DESC = "When a topic is deleted, an entry with the status <em>410 Gone</em> is made in the Joomla redirects (Components - Redirects), so the search engines know the topic is gone instead of reporting a 404 error. A restored topic loses its entry again. The forum pages answer with 410 by themselves: the Joomla redirect plugin is not needed for them."
COM_KUNENA_A_INACTIVE_LOCK_DAYS = "Close inactive topics after (days)"
COM_KUNENA_A_INACTIVE_LOCK_DAYS_DESC = "A topic without a new message for this number of days can not get a reply any more, so old topics are not raised. Moderators can still reply. 0 never closes topics. A category can have its own number."
COM_KUNENA_A_LOCK_REASONS = "Reasons to lock a topic"
COM_KUNENA_A_LOCK_REASONS_DESC = "One reason per line, as plain text or as a language key. The reason is shown next to the subject of a locked topic. An empty list turns the reasons off. A locked topic keeps its reason when the list changes."
COM_KUNENA_A_LOCK_BY_AUTHOR = "Authors can lock their own topics"
COM_KUNENA_A_LOCK_BY_AUTHOR_DESC = "The author of a topic can lock it with one of the reasons of the list. Only the moderators can unlock it."
COM_KUNENA_A_ACCEPTED_ANSWERS = "Accepted answers"
COM_KUNENA_A_ACCEPTED_ANSWERS_DESC = "The author of a topic and the moderators can accept a reply as the answer of the topic. The answer is shown at the top of the topic and the topic is marked as solved."
COM_KUNENA_A_WARNINGS = "Warnings with points"
COM_KUNENA_A_WARNINGS_DESC = "The moderators can give a warning with points and a reason to the author of a message. The points count until they expire; when the active points of a user reach the threshold, he is banned automatically."
COM_KUNENA_A_WARNING_EXPIRE_DAYS = "Points expire after (days)"
COM_KUNENA_A_WARNING_EXPIRE_DAYS_DESC = "The days after which the points of a warning do not count any more. 0: they never expire."
COM_KUNENA_A_WARNING_BAN_POINTS = "Ban at (points)"
COM_KUNENA_A_WARNING_BAN_POINTS_DESC = "The active points at which the user is banned automatically. 0: no automatic ban."
COM_KUNENA_A_WARNING_BAN_DAYS = "Length of the automatic ban (days)"
COM_KUNENA_A_WARNING_BAN_DAYS_DESC = "The days of the automatic ban. 0: the ban is permanent."
COM_KUNENA_A_BOOKMARKS = "Bookmarks of messages"
COM_KUNENA_A_BOOKMARKS_DESC = "The users can bookmark single messages and find them again in the list My bookmarks. The bookmarks of a user are private."
COM_KUNENA_A_DIGEST_EMAILS = "Digest e-mails"
COM_KUNENA_A_DIGEST_EMAILS_DESC = "The users can choose, in their profile, one e-mail a day or a week with the new posts of their subscriptions instead of an e-mail for each post. The digests are sent by the scheduled task <em>Kunena Send Digests</em> (System, Scheduled Tasks)."
COM_KUNENA_A_EDIT_HISTORY = "Edit history"
COM_KUNENA_A_EDIT_HISTORY_DESC = "Each edit of a message keeps the subject and the text before it (the last 20 versions of a message). Choose who can see the earlier versions, with the changes of each edit. Off keeps no history."
COM_KUNENA_A_EDIT_HISTORY_OFF = "Off"
COM_KUNENA_A_EDIT_HISTORY_MODERATORS = "Moderators"
COM_KUNENA_A_EDIT_HISTORY_EVERYBODY = "Everybody who can read the message"
COM_KUNENA_A_REACTIONS = "Reactions"
COM_KUNENA_A_REACTIONS_DESC = "The emoji which users can give to the messages of other users, separated by spaces (at most 8). One reaction per user and message. Leave empty to turn the reactions off."
COM_KUNENA_CATEGORY_TEASER = "Hide replies for guests"
COM_KUNENA_CATEGORY_TEASER_DESC = "Guests must log in to read the replies of this category (the first message of a topic stays visible). The global option Hide Replies For Guests of the configuration is the default."
COM_KUNENA_CATEGORY_TEASER_GLOBAL = "Use the global setting"
COM_KUNENA_CATEGORY_TEASER_HIDE = "Hide the replies"
COM_KUNENA_CATEGORY_TEASER_SHOW = "Show the replies"
COM_KUNENA_CATEGORY_OWN_TOPICS_ONLY = "Users see only their own topics"
COM_KUNENA_CATEGORY_OWN_TOPICS_ONLY_DESC = "Use the category as a helpdesk: a user can only see (and find) the topics he started. Moderators of the category and administrators see all topics."
COM_KUNENA_CATEGORY_MODERATOR_GROUPS = "Moderator groups"
COM_KUNENA_CATEGORY_SUBSCRIBERS_TAB = "Subscribers (%d)"
COM_KUNENA_CATEGORY_SUBSCRIBERS = "Users subscribed to this category"
COM_KUNENA_CATEGORY_NO_SUBSCRIBERS = "Nobody is subscribed to this category."
COM_KUNENA_CATEGORY_MODERATOR_GROUPS_DESC = "Every member of a selected user group, and of its child groups, moderates this category only (not its subcategories). Every such member appears in the list of moderators of the category in the forum and receives the moderator emails. Guests and banned users are never moderators. The moderators assigned by hand are listed below."
COM_KUNENA_CATEGORY_INACTIVE_LOCK_DAYS = "Close inactive topics after (days)"
COM_KUNENA_CATEGORY_INACTIVE_LOCK_DAYS_DESC = "Leave empty to use the global setting (Frontend tab of the configuration), 0 to never close the topics of this category."
COM_KUNENA_A_ENABLE_FOLLOW = "Enable Follow User"
COM_KUNENA_A_ENABLE_FOLLOW_DESC = "If you want to allow registered users to follow other users, select <em>Yes</em>. A follower gets an e-mail when the followed user starts a new topic (with a link to stop following), sees the latest topics of the followed users on his profile and gets a marker in the lists of topics."
COM_KUNENA_A_ENABLE_IGNORE = "Enable Ignore User"
COM_KUNENA_A_ENABLE_IGNORE_DESC = "If you want to allow registered users to ignore other users, select <em>Yes</em>. The messages and the topics of an ignored user are hidden for the user who ignores (messages can be shown with a click), and the user gets no e-mails about the posts of an ignored user. Moderators and administrators can not be ignored."
COM_KUNENA_A_ENABLE_DRAFTS = "Enable Drafts"
COM_KUNENA_A_ENABLE_DRAFTS_DESC = "If you want to allow registered users to save a new topic or a reply as a draft and to finish it later, select <em>Yes</em>. Users find their drafts in the profile box, or on a menu item of the type <em>My Drafts</em>."
COM_KUNENA_COM_A_REPORT_ORDERING_SYSTEM_DESC = "Choose how messages will be numbered inside topic. You can show the post IDs ( #324, #465, #768... ) or incremental numbers (#1, #2, #3...)"
COM_KUNENA_COM_A_SESSIONS_START_TIME_DESC = "Show online users since a specific time in seconds."
COM_KUNENA_COM_A_SESSIONS_TYPE_DESC = "Show online users with a specific setting."
COM_KUNENA_COM_A_SHOW_TOPICS_FROM_LAST_TIME = "Recent Topics Time Period"
COM_KUNENA_COM_A_SHOW_TOPICS_FROM_LAST_TIME_DESC = "Show recent topics from the following time."
COM_KUNENA_COM_A_TOPCIICONS_DESC = "If set to <em>Yes</em>, users can choose their own topic icon. Otherwise topic icon shows the status of the topic (normal, sticky, locked etc)."
COM_KUNENA_COM_A_TOPICICONS = "Selectable Topic Icons"
COM_KUNENA_COM_A_TOPIC_LAYOUT = "Default topic layout"
COM_KUNENA_COM_A_TOPIC_LAYOUT_DESC = "Select the topic layout that will be the default for all users (until they select one themselves in the Layout menu of a topic). Flat shows the messages one after the other, threaded shows one message with the tree of the messages of the page below it, indented moves each reply in under the message it answers."
COM_KUNENA_COM_A_USER_SESSIONS_START_TIME = "Online Users Time Limit"
COM_KUNENA_COM_A_USER_SESSIONS_TYPE = "Online Users Contains"
COM_KUNENA_COM_A_WAY_COUNT_USERS_USERLIST = "User Count Contains"
COM_KUNENA_COM_A_WAY_COUNT_USERS_USERLIST_DESC = "How to count total users in your site: All Users, All Real Users (logged in after registration), Only Active Users (not banned)"
COM_KUNENA_DEBUG_MODE = "Enable Debug Mode"
COM_KUNENA_DEBUG_MODE_DESC = "Set <em>Yes</em> to enable debug mode."
COM_KUNENA_LISTCAT_SHOW_MODERATORS = "Show Moderators in Category Index"
COM_KUNENA_LISTCAT_SHOW_MODERATORS_DESC = "Set <em>Yes</em> if you want to show moderators in the category listing. <em>No</em> will allow you to have tighter layout."
COM_KUNENA_TOPIC_SHOW_MODERATORS = "Show Moderators in Topic View"
COM_KUNENA_TOPIC_SHOW_MODERATORS_DESC = "Set <em>Yes</em> if you want to show the moderators of the category at the bottom of a topic. <em>No</em> will allow you to have tighter layout."
COM_KUNENA_MAILFULL = "Include Post Contents"
COM_KUNENA_MAILFULL_DESC = "Set to <em>Yes</em> if you want subscription notification to contain the whole message."
COM_KUNENA_NUMPOP = "Number of Popular Subjects"
COM_KUNENA_PICKUP_CATEGORY = "Force users to pickup a category"
COM_KUNENA_PICKUP_CATEGORY_DESC = "Force users to pickup a category instead of set the actual category"
COM_KUNENA_POLLSPOP = "Number of Popular Polls"
COM_KUNENA_POLLSSTATS = "Show Popular Poll Statistics"
COM_KUNENA_POLLSTATSDESC = "If you want to show the Popular Polls, select <em>Yes</em>."
COM_KUNENA_SEF = "Search Engine Friendly URLs"
COM_KUNENA_SEF_DESC = "Select whether or not URLs are optimized for search engines. NOTE: Kunena accepts SEF URLs even if this feature has been turned off."
COM_KUNENA_SEF_UTF8 = "Enable UTF-8 Support"
COM_KUNENA_SEF_UTF8_DESC = "Use this option if your SEF URLs are not readable. Result: http://www.domain.com/forum/2-Catégorie/123-Meßage . NOTE: Kunena accepts UTF-8 URLs even if this feature has been turned off."
COM_KUNENA_SEO_SETTINGS = "SEO Settings"
COM_KUNENA_SHOWFILEFORGUEST = "Show Attachments for Guests"
COM_KUNENA_SHOWFILEFORGUEST_DESC = "Set to <em>Yes</em> if you want to show attachments for guests."
COM_KUNENA_SHOWIMGFORGUEST = "Show Images for Guests"
COM_KUNENA_SHOWIMGFORGUEST_DESC = "Set to <em>Yes</em> if you want to show images for guests."
COM_KUNENA_SHOWSTATS = "Show Statistics"
COM_KUNENA_SHOWSTATSDESC = "If you want to show the statistics, select <em>Yes</em>."
COM_KUNENA_SHOWWHOIS = "Show Who is Online"
COM_KUNENA_SHOWWHOISDESC = "If you want to show Whois Online, select <em>Yes</em>."
COM_KUNENA_SHOW_ANNOUNCEMENT = "Show Announcement"
COM_KUNENA_SHOW_ANNOUNCEMENT_DESC = "Set to <em>Yes</em> if you want to show the announcement box on your forum home page."
COM_KUNENA_SHOW_AVATAR_ON_CAT = "Show Avatar on Category Index and Recent Topics"
COM_KUNENA_SHOW_AVATAR_ON_CAT_DESC = "Set to <em>Yes</em> if you want to show user avatar on Category Index, Recent Topics and My Topics."
COM_KUNENA_SHOW_CHILD_CATEGORY_ON_LIST = "Show Sub-Category Image"
COM_KUNENA_SHOW_CHILD_CATEGORY_ON_LIST_DESC = "If you want to show sub-category small icon on your Category Index, set to <em>Yes</em>."
COM_KUNENA_STATS = "Statistics Settings"
COM_KUNENA_STATSGENERAL = "Show General Statistics"
COM_KUNENA_STATSGENERALDESC = "If you want to show the General Statistics, select <em>Yes</em>."
COM_KUNENA_STOP_FORUM_SPAM_CONFIGURATION = "Stop Forum Spam Configuration"
COM_KUNENA_STOP_FORUM_SPAM_KEY = "API key"
COM_KUNENA_STOP_FORUM_SPAM_KEY_DESC = "The service API key. Get one at <a href='http://www.stopforumspam.com/' target='_blank'>stopforumspam</a>"
COM_KUNENA_STOP_FORUM_SPAM_NEWUSERCHECK = "Check New User"
COM_KUNENA_STOP_FORUM_SPAM_NEWUSERCHECK_DESC = "Check New User when created on username, email and ip-address. If found on StopForumSpam account will not be created."
COM_KUNENA_SUBSCRIPTIONSCHECKED = "Check Subscription Box"
COM_KUNENA_SUBSCRIPTIONSCHECKED_DESC = "Set to <em>Yes</em> if you want the post subscription box to be checked by default."
COM_KUNENA_THANKSPOP = "Number of Popular Thank Yous"
COM_KUNENA_THANKSSTATS = "Show Popular Thank You Statistics"
COM_KUNENA_THANKSSTATSDESC = "If you want to show the Popular Thank you, select <em>Yes</em>. "
COM_KUNENA_TIME_TO_CREATEPAGE = "Display Page Creation Time"
COM_KUNENA_TIME_TO_CREATEPAGE_DESC = "Display time to create page in Kunena footer"
COM_KUNENA_USERNUM = "Number of Popular Users"
COM_KUNENA_USERPOPULAR = "Show Popular Subject Statistics"
COM_KUNENA_USERPOPULARDESC = "If you want to show the Popular Subject, select <em>Yes</em>."
COM_KUNENA_USERSTATS = "Show Popular User Statistics"
COM_KUNENA_USERSTATSDESC = "If you want to show the Popular Statistics, select <em>Yes</em>."
COM_KUNENA_VERSION_CHECK = "Enable Version Check"
COM_KUNENA_VERSION_CHECK_DESC = "Set <em>Yes</em> if you want Kunena to check if there are new Kunena releases available."
COM_KUNENA_A_IP_TRACKING = "IP Address Tracking"
COM_KUNENA_A_IP_TRACKING_DESC = "If set to <em>Yes</em>, forum will record IP address for every posted message (excluding anonymous posting feature). While the feature can be very useful when fighting against spam and malicious users, storing IP address without making users to accept it in the terms may be illegal in some countries."
COM_KUNENA_ADMIN_CONFIG_STATSLINK_ALLOWED = "Allow Guests to see Stats link"
COM_KUNENA_ADMIN_CONFIG_STATSLINK_ALLOWED_DESC = "Set to <em>Yes</em> to allow Guests to see Stats link."
COM_KUNENA_ADMIN_CONFIG_USERLIST_SETTINGS = "Userlist Settings"
COM_KUNENA_A_USER_CAN_SEND_OWN_REPORT = "User can report himself"
COM_KUNENA_A_USER_CAN_SEND_OWN_REPORT_DESC = "Set to <em>Yes</em> if you want users can report himself on the messages"
COM_KUNENA_CFG_SEARCH_TIME = "Search Time"
COM_KUNENA_CFG_SEARCH_TIME_DESC = "Set the default search time <em>Big Sites must be set max year, because performance issues</em>"
COM_KUNENA_CFG_SEARCH_DATE_2WEEKS = "2 weeks ago"
COM_KUNENA_CFG_SEARCH_DATE_3MONTHS = "3 months ago"
COM_KUNENA_CFG_SEARCH_DATE_6MONTHS = "6 months ago"
COM_KUNENA_CFG_SEARCH_DATE_ANY = "Any date"
COM_KUNENA_CFG_SEARCH_DATE_LASTVISIT = "Last visit"
COM_KUNENA_CFG_SEARCH_DATE_MONTH = "A month ago"
COM_KUNENA_CFG_SEARCH_DATE_NEWER = "And newer"
COM_KUNENA_CFG_SEARCH_DATE_OLDER = "And older"
COM_KUNENA_CFG_SEARCH_DATE_WEEK = "A week ago"
COM_KUNENA_CFG_SEARCH_DATE_YEAR = "A year ago"
COM_KUNENA_CFG_SEARCH_DATE_YESTERDAY = "Yesterday"
COM_KUNENA_TEASER = "Hide Replies For Guests"
COM_KUNENA_TEASER_DESC = "When enabled, users must be login before reading the answers."
COM_KUNENA_CONFIGURATION_EBAY_API_KEY_LABEL = "eBay AppID key"
COM_KUNENA_CONFIGURATION_EBAY_API_KEY_DESC = "You need to enter the AppID given on your ebay developer account, you need to register on <a href='https://developer.ebay.com/' target='_new'>https://developer.ebay.com/</a> in order to get the AppID"
COM_KUNENA_CONFIGURATION_EBAY_CERTID_KEY_LABEL = "eBay Cert ID (Client Secret)"
COM_KUNENA_CONFIGURATION_EBAY_CERTID_KEY_DESC = "You need to enter the eBay Cert ID given on your ebay developer account"
COM_KUNENA_CONFIGURATION_X_SOCIAL_API_CONSUMER_KEY_LABEL = "The X consumer key"
COM_KUNENA_CONFIGURATION_X_SOCIAL_API_CONSUMER_KEY_DESC = "The X consumer key to connect to API"
COM_KUNENA_CONFIGURATION_X_SOCIAL_API_CONSUMER_SECRET_LABEL = "The X consumer secret"
COM_KUNENA_CONFIGURATION_X_SOCIAL_API_CONSUMER_SECRET_DESC = "The X consumer secret to connect to API"
COM_KUNENA_CONFIGURATION_BLUESKYAPP_HANDLE_OF_APP_LABEL = "BlueSky App ID"
COM_KUNENA_CONFIGURATION_BLUESKYAPP_HANDLE_OF_APP_DESC = "The BlueSky consumer key to connect to API"
COM_KUNENA_CONFIGURATION_BLUESKYAPP_PASSWORD_OF_APP_LABEL = "The BlueSky consumer secret"
COM_KUNENA_CONFIGURATION_BLUESKYAPP_PASSWORD_OF_APP_DESC = "The BlueSky consumer secret to connect to API"
COM_KUNENA_ADMIN_CONFIG_MAX_LINKS = "Max Links in message"
COM_KUNENA_ADMIN_CONFIG_MAX_LINKS_DESC = "Enter here the max links in a message to prevent spam"
COM_KUNENA_CONFIGURATION_CAPTCHA_FOR_WHO_TITLE = "Display Captcha for :"
COM_KUNENA_CONFIGURATION_CAPTCHA_FOR_WHO_DESC = "Choose if guest or registered users can be see captcha or nobody to disable it completely.<br /> <strong>Hint:</strong> For registered users, the captcha is displayed only if a number is entered in the 'CAPTCHA Challenge for Users'."
COM_KUNENA_CONFIGURATION_OPTION_CAPTCHA_NOBODY = "Nobody"
COM_KUNENA_CONFIGURATION_OPTION_CAPTCHA_REGISTERED_USERS = "Registered Users"
COM_KUNENA_CONFIGURATION_OPTION_CAPTCHA_GUESTS_REGISTERED_USERS = "Guests Users And Registered Users"
COM_KUNENA_ALLOW_CHANGE_SUBJECT_REPLIES_LABEL = "Let users edit the subject"
COM_KUNENA_ALLOW_CHANGE_SUBJECT_REPLIES_DESC = "Allow users to change the subject of their topics and replies."
COM_KUNENA_A_BOARD_READONLY = "Read Only Mode"
COM_KUNENA_A_BOARD_READONLY_DESC = "Allow users only to read messages"
COM_KUNENA_CONFIGURATION_RATING_ENABLED = "Allow rating"
COM_KUNENA_CONFIGURATION_RATING_DESC = "Allow rating on topics, you need to allow too into categories settings"
COM_KUNENA_ADMIN_CONFIG_URL_SUBJECT = "Prevent posting topic or reply with URL in title"
COM_KUNENA_ADMIN_CONFIG_URL_SUBJECT_DESC = "Prevent posting topic or reply with URL in title to limit some spam messages"
COM_KUNENA_CFG_ACCESS_COMPONENT = "Direct Component Access"
COM_KUNENA_CONFIGURATION_LOG_COLLECT_DATA = "Define if you want to log action or moderation"
COM_KUNENA_CONFIGURATION_LOG_COLLECT_DATA_DESC = "Define if you want to log action or moderation from the forum"
COM_KUNENA_CONFIGURATION_LOG_ACTIONLOG = "Copy moderation actions to the User Actions Log"
COM_KUNENA_CONFIGURATION_LOG_ACTIONLOG_DESC = "The moderation actions are also written to the User Actions Log of Joomla (who did it, the action, the topic, the category and the user it concerns; never reasons, comments or IP addresses). Kunena Forum must also be selected in the Events To Log option of User Actions Log."
COM_KUNENA_CONFIG_ATTACHMENT_SHORTEN_NAME_START = "Number of characters from start for shorten filename"
COM_KUNENA_CONFIG_ATTACHMENT_SHORTEN_NAME_START_DESC = "Define the number of characters from start when shorten attachments filename"
COM_KUNENA_CONFIG_ATTACHMENT_SHORTEN_NAME_END = "Number of characters from end for shorten filename"
COM_KUNENA_CONFIG_ATTACHMENT_SHORTEN_NAME_END_DESC = "Define the number of characters from end when shorten attachments filename"
COM_KUNENA_CONFIGURATION_MAP_PROVIDER = "Maps"
COM_KUNENA_CONFIGURATION_MAP_PROVIDER_DESC = "The maps of the [map] bbcode and the links to a location. Automatic uses Google Maps when a Google Maps API key is filled in below, and OpenStreetMap when it is not. OpenStreetMap needs no key and no billing account."
COM_KUNENA_CONFIGURATION_MAP_PROVIDER_AUTO = "Automatic"
COM_KUNENA_CONFIGURATION_MAP_PROVIDER_GOOGLE = "Google Maps"
COM_KUNENA_CONFIGURATION_MAP_PROVIDER_OSM = "OpenStreetMap"
COM_KUNENA_CONFIGURATION_GEOCODER_URL = "Search service for the addresses of the maps"
COM_KUNENA_CONFIGURATION_GEOCODER_URL_DESC = "OpenStreetMap maps need the coordinates of an address. They come from a Nominatim search service, once for every address (the answer is kept for a long time in the cache of Joomla). The public service of OpenStreetMap is the default; its usage policy is fair use, for a busy forum use your own service."
COM_KUNENA_CONFIGURATION_GOOGLE_MAPS_API_KEY = "Google maps API key to get better stats usage of google API"
COM_KUNENA_CONFIGURATION_GOOGLE_MAPS_API_KEY_DESC = "Google maps API key to get better stats usage of google API. You need to enable the Google Maps Geocoding API in the developer console. <a href='https://console.developers.google.com/flows/enableapi?apiid=maps_backend&keyType=CLIENT_SIDE&reusekey=true' target='_blank'>Ask your API key</a>"
COM_KUNENA_CONFIGURATION_ATTACHMENT_FILENAME_UTF8 = "Enable utf8 characters on attachments"
COM_KUNENA_CONFIGURATION_ATTACHMENT_FILENAME_UTF8_DESC = "Enable utf8 characters on attachments filename which are uploaded on the server."
COM_KUNENA_CONFIGURATION_AUTOEMBEDSOUNDCLOUD = "Auto Embed Soundcloud items"
COM_KUNENA_CONFIGURATION_AUTOEMBEDSOUNDCLOUD_DESC = "Set to Yes if you want Soundcloud items to get automatically embedded."
COM_KUNENA_CONFIGURATION_AUTOEMBEDSPOTIFY = "Auto Embed Spotify items"
COM_KUNENA_CONFIGURATION_AUTOEMBEDSPOTIFY_DESC = "Set to Yes if you want a link to a Spotify track, album, playlist, show or episode to be shown as the Spotify player."
COM_KUNENA_CONFIGURATION_AUTOEMBEDDEEZER = "Auto Embed Deezer items"
COM_KUNENA_CONFIGURATION_AUTOEMBEDDEEZER_DESC = "Set to Yes if you want a link to a Deezer track, album, playlist, show or episode to be shown as the Deezer player."
COM_KUNENA_CONFIGURATION_LINKPREVIEW = "Link cards"
COM_KUNENA_CONFIGURATION_LINKPREVIEW_DESC = "Set to Yes to show a card (the title, a short description and the picture of the page) for a link which is pasted in a message. The server reads the page once and keeps the card for a week; the picture is loaded by the visitor from the other site. Links written with the url tag stay normal links."
COM_KUNENA_CONFIGURATION_LINKPREVIEW_MAX = "Most cards in a message"
COM_KUNENA_CONFIGURATION_LINKPREVIEW_MAX_DESC = "The other links of the message stay normal links."
COM_KUNENA_CONFIGURATION_LINKPREVIEW_BLOCK = "Sites without a card"
COM_KUNENA_CONFIGURATION_LINKPREVIEW_BLOCK_DESC = "Domains (one on each line, for example example.com) which never get a card. Their subdomains are included."
COM_KUNENA_CONFIGURATION_OWNDOMAINS = "Own domains"
COM_KUNENA_CONFIGURATION_OWNDOMAINS_DESC = "Domains of your own (one on each line, for example example.com). Their subdomains are included. The links in messages to these domains get no rel=\"nofollow noopener noreferrer\"."
COM_KUNENA_EMAIL_HEADER = "Email Header Image"
COM_KUNENA_EMAIL_HEADER_DESC = "Enter the path to your email header image.Default = <em>media/kunena/email/hero-wide.png</em>. Leave empty for no image."
