name: Bug Report
description: Create a report to help us improve Kunena
labels: ["bug"]
type: bug
body:
  - type: markdown
    attributes:
      value: |

        Thanks for taking the time to fill out this bug report!

        **⚠️ Please never use standard issues to report security problems. See [security policy](https://github.com/Kunena/Kunena-Forum/security/policy) for more details. ⚠️**

        BEFORE SUBMITTING YOUR ISSUE, please make sure to read and follow these steps:

        * We do not support community plugins. Contact directly their authors, or use [the community forum](https://forum.glpi-project.org).
        * We do not track feature requests nor enhancements here. Propose them on the [suggest dedicated site](https://suggest.glpi-project.org).
        * Keep this tracker in ENGLISH. If you want support in your language, the [Kunena forum](https://www.kunena.org/forum/kunena-in-other-languages) is the best place.
        * Always try to reproduce your issue at least on latest stable release.

        The Kunena team.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow hereinabove rules and [Contribution guide](https://github.com/Kunena/Kunena-Forum/blob/main/CONTRIBUTING.md)
      options:
        - label: I agree to follow this project's Code of Conduct
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
    validations:
      required: true
  - type: dropdown  
    id: version
    attributes:
      label: Version
      description: What version of Kunena are you running?
      options:
        - 6.4.x
        - 7.0.x
        - 7.1.x
      default: 0
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Do-you tried to reproduce with Aurelia template?
      description: Please try to reproduce your issue with Aurelia template.
      options:
        - label: I have tried to reproduce the issues with Aurelia template
    validations:
      required: true
  - type: textarea
    attributes:
      label: Bug description
      description: A concise description of the problem you are experiencing and what you expected to happen.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Please copy and paste any relevant log output. Find them in /administrator/logs/.

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
      render: shell
  - type: input
    id: url
    attributes:
      label: Page URL
      description: If applicable, page URL where the bug happens.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Steps To reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. With this config...
        2. Go to...
        3. Scroll down to...
        4. See error...
    validations:
      required: false
  - type: textarea
    attributes:
      label: Your Kunena setup information
      description: Please copy and paste all relevant system information. You can find them in your Joomla! backend under "System => System Information".
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: Add any other context about the problem here.
    validations:
      required: false
