name: CI

on: [push, pull_request]

jobs:
  run:    
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: ['8.4', '8.5']
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: intl, fileinfo, mbstring
        ini-values: post_max_size=256M, upload_max_filesize=256M, max_execution_time=300, max_input_time=300
        tools: cs2pr
    - name: Check PHP Version
      run: php -v
    - name: Composer & Npm Install
      run: |
       composer validate --no-check-all --strict
       composer install --no-progress --no-suggest --no-interaction --optimize-autoloader
       pwd
    - name: Check the code style (php-cs-fixer)
      continue-on-error: true
      run: |
        vendor/bin/php-cs-fixer fix --dry-run --config=.php-cs-fixer.dist.php --format=checkstyle > $GITHUB_WORKSPACE/php-cs-fixer-report.xml
    - name: Show the code style results in PR
      continue-on-error: true
      run: cs2pr $GITHUB_WORKSPACE/php-cs-fixer-report.xml --graceful-warnings --colorize
