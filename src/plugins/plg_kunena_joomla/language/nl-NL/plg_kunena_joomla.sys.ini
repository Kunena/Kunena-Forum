PLG_KUNENA_JOOMLA="Kunena - Joomla Integratie"
PLG_KUNENA_JOOMLA_INTEGRATION_DESCRIPTION="Kunena plugin voor gebruik van Joomla! toegang en login in Kunena.<br /><br />Schakel deze plugin niet uit!"

PLG_KUNENA_JOOMLA_ACCESSTYPE_LEVEL="Joomla toegangsniveaus"
PLG_KUNENA_JOOMLA_ACCESSTYPE_GROUP="Joomla! Gebruikersgroepen"
PLG_KUNENA_JOOMLA_ACCESS_LEVEL_TITLE="Toegangsniveau:"
PLG_KUNENA_JOOMLA_ACCESS_LEVEL_DESC="De <em>Toegangsniveaugroep</em> die deze categorie mag bekijken."
PLG_KUNENA_JOOMLA_ACCESS_LEVEL_DESC_J25="<strong>Hint:</strong> Je kunt je eigen toegangsniveaus definiëren in <em>Joomla &gt;&gt; Gebruikers &gt;&gt; toegangsniveaus</em>."
PLG_KUNENA_JOOMLA_ACCESS_GROUP_PRIMARY_TITLE="Primaire gebruikersgroep:"
PLG_KUNENA_JOOMLA_ACCESS_GROUP_PRIMARY_DESC="De gebruikersgroep die deze categorie mag bekijken."
PLG_KUNENA_JOOMLA_ACCESS_GROUP_PRIMARY_DESC2="Standaard is toegang verleend aan iedereen die de gebruikersgroep erft. U kunt ook de toegang tot de opgegeven gebruikersgroep alleen beperken door <em>"_QQ_"Inclusief Child Groepen = Nee</em> in te voeren."
PLG_KUNENA_JOOMLA_ACCESS_GROUP_PRIMARY_HINT_DESC="<strong>Hint:</strong> <em>Publiek</em> betekent ofwel iedereen of alleen gasten afhankelijk van de <em>Voeg subgroepen</em> instelling toe als je <em>Gast Gebruikersgroep</em> van <em>Joomla &gt;&gt; Gebruikers &gt;&gt; Gebruikersgroepen &gt;&gt; Opties</em> hebt gewijzigd."
PLG_KUNENA_JOOMLA_ACCESS_GROUP_PRIMARY_CHILDS_TITLE="Primaire groep inclusief onderliggende groepen:"
PLG_KUNENA_JOOMLA_ACCESS_GROUP_PRIMARY_CHILDS_DESC="Moet ook de primaire subgroepen toegang krijgen? Indien ingesteld op <em>Nee</em>, is de toegang tot deze categorie beperkt tot de geselecteerde groep <strong>alleen</strong>."
PLG_KUNENA_JOOMLA_ACCESS_GROUP_SECONDARY_TITLE="Secundaire gebruikersgroep:"
PLG_KUNENA_JOOMLA_ACCESS_GROUP_SECONDARY_DESC="Secundaire gebruikersgroep die deze categorie mag bekijken."
PLG_KUNENA_JOOMLA_ACCESS_GROUP_SECONDARY_DESC2="Secundaire groep kan bijvoorbeeld handig zijn als zowel <em>Publishers</em> als <em>Managers</em> de categorie moeten kunnen zien."
PLG_KUNENA_JOOMLA_ACCESS_GROUP_SECONDARY_HINT_DESC="<strong>Hint:</strong> U kunt de secundaire groep uitschakelen door het op dezelfde waarde te zetten als <em>Primaire Gebruikersgroep</em>. <br /> <strong>Hint:</strong> Het kan een beter idee zijn om een <em>Access Level</em> te maken in plaats van een <em>Secundaire Gebruikersgroep</em> te gebruiken."
PLG_KUNENA_JOOMLA_ACCESS_GROUP_SECONDARY_CHILDS_TITLE="Secundaire bevat childgroepen:"
PLG_KUNENA_JOOMLA_ACCESS_GROUP_SECONDARY_CHILDS_DESC="Moet ook de primaire subgroepen toegang krijgen? Indien ingesteld op <em>Nee</em>, is de toegang tot deze categorie beperkt tot de geselecteerde groep <strong>alleen</strong>."
PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_TITLE="Gebruikersgroepen die mogen posten"
PLG_KUNENA_JOOMLA_ACCESS_GROUPS_POST_DESC="Selecteer gebruikersgroepen die een nieuw onderwerp mogen plaatsen in deze categorie. Deze instelling heeft alleen invloed op gebruikers die al leesrechten hebben voor de categorie. Gasten kunnen geen nieuwe onderwerpen maken tenzij u <em>Forum > Configuratie > Beveiliging > Gasten toestaan om te posten/schrijven</em>. <br /><br /> <strong>Hint:</strong> Je kunt meerdere groepen selecteren door <em>Ctrl</em> of <em>Shift</em> knoppen ingedrukt te houden."
PLG_KUNENA_JOOMLA_ACCESS_GROUPS_REPLY_TITLE="Gebruikersgroepen die mogen reageren"
PLG_KUNENA_JOOMLA_ACCESS_GROUPS_REPLY_DESC="Selecteer gebruikersgroepen die een nieuw onderwerp mogen plaatsen in deze categorie. Deze instelling heeft alleen invloed op gebruikers die al leesrechten hebben voor de categorie. Gasten kunnen geen nieuwe onderwerpen maken tenzij u <em>Forum > Configuratie > Beveiliging > Gasten toestaan om te posten/schrijven</em>. <br /><br /> <strong>Hint:</strong> Je kunt meerdere groepen selecteren door <em>Ctrl</em> of <em>Shift</em> knoppen ingedrukt te houden."

PLG_KUNENA_JOOMLA_ACCESS="Toegangscontrole inschakelen"
PLG_KUNENA_JOOMLA_ACCESS_DESC="Gebruik Joomla toegangsniveaus en gebruikersgroepen om te controleren wie toegang heeft tot de categorieën. LET OP: U moet deze optie alleen uitschakelen als u een andere ACL methode gebruikt en u niet wilt dat normale gebruikers de categorieën zien."
PLG_KUNENA_JOOMLA_LOGIN="Schakel Joomla login in"
PLG_KUNENA_JOOMLA_LOGIN_DESC="Gebruik Joomla login en registratie in Kunena."

COM_KUNENA_INTEGRATION_TYPE_JOOMLA_GROUP="Gebruikersgroepen"
COM_KUNENA_INTEGRATION_TYPE_JOOMLA_LEVEL="Toegangsniveau"

